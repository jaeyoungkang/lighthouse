    version: 1
    owner: product
    actor: user
    surface: research-route
    storyRefs:
      experienceRef: experience:research-and-discovery
      momentRef: moment:gap-analysis-from-results
      aspectRefs:
        - aspect:ai-generated-content-feedback
      acceptanceCheckRefs: []
      scenarioRefs: []
    observability:
      realitySignal: false
      signalMeaning: user submitted helpful/not-helpful feedback for visible AI-generated content
      severity: info
      requiredForPromiseCoverage: false
    trigger:
      source: client
      phase: completed
      timing: the shared AI content feedback affordance records a changed helpful/not-helpful selection after updating the
        local submitted state
    measurement:
      purpose: Measure which visible AI-generated content surfaces receive helpful/not-helpful feedback without storing raw AI
        output text.
      decisionUse: Review feedback by Promise family, surface, and output fingerprint to prioritize future quality
        investigation; this event does not train models or change ranking automatically.
      propertyPurposes:
        documentId: Connect feedback to the source ResearchRoutePayload or persisted gap report artifact when one exists.
        documentType: Distinguish search, citation-lineage, graph-neighbor, and gap ResearchRoutePayload feedback contexts.
        surfaceId: Identify the concrete visible AI output surface that received feedback.
        surfaceKind: Group feedback by shared UI surface family.
        promiseRef: Connect the feedback to the Promise family under evaluation.
        value: Record the user's helpful/not-helpful selection.
        previousValue: Distinguish first submissions from changed feedback selections within the same browser session.
        outputTitleHash: Preserve title provenance without storing raw title text.
        outputTitleLength: Preserve title shape without storing raw title text.
        outputBodyHash: Preserve output body provenance without storing raw body text.
        outputBodyLength: Preserve output body shape without storing raw body text.
        outputTimestamp: Connect feedback to the generated output version when the surface exposes a timestamp.
        metadataPaperId: Connect inline analysis feedback to the paper when that metadata exists.
        metadataSource: Distinguish abstract/full-text/provider source metadata for inline analysis feedback.
        metadataSelectionKind: Distinguish focused gap overlay feedback for gap, cluster, or concept selections.
    subject:
      allowed:
        - documentId
        - surfaceId
        - promiseRef
    properties:
      required:
        - surfaceId
        - surfaceKind
        - promiseRef
        - value
        - outputBodyHash
        - outputBodyLength
      optional:
        - documentId
        - documentType
        - previousValue
        - outputTitleHash
        - outputTitleLength
        - outputTimestamp
        - metadataPaperId
        - metadataSource
        - metadataSelectionKind
      forbidden:
        - token
        - outputSnapshot
        - outputBody
        - outputTitle
        - body
        - title
        - metadata
    privacy:
      level: user_private
      allowExternalSinks: false
    emission:
      boundary: command_handler
      cardinality: every_action
      identityKeys:
        - subject.surfaceId
        - subject.promiseRef
        - properties.value
      emitter: trackAiContentFeedbackSubmitted
    sinks: {}
  - name: product.gap_led_next_search.clicked
    version: 2
    owner: product
    actor: user
    surface: research-route
    storyRefs:
      experienceRef: experience:research-and-discovery
      momentRef: moment:gap-led-followup-discovery
      promiseRef: promise:gap-led-next-search
      aspectRefs: []
      acceptanceCheckRefs:
        - acceptance-check:gap-led-next-search-seed-launches-search
      scenarioRefs:
        - scenario:search-gap-analysis-entry
    observability:
      realitySignal: true
      signalMeaning: user clicked the seed-as-search action on a focused cluster or gap card to start a follow-up search from
        a gap report seed
      severity: info
      requiredForPromiseCoverage: true
    trigger:
      source: client
      phase: completed
      timing: focused cluster/gap card seed-as-search button is clicked; the search-term handler navigates to a route-owned
        `/search?q=` execution
    measurement:
      purpose: Answer whether users actually carry gap report seeds into follow-up searches in real research-route use.
      decisionUse: Use this signal to review whether the seed-as-search affordance needs UX or contract follow-up; it does not
        change verdicts automatically.
      propertyPurposes:
        viewerPrincipalId: Support product.gap_led_next_search.clicked measurement by recording the authenticated viewer
          principal id as behavior metadata.
        documentId: Support product.gap_led_next_search.clicked measurement by recording the originating gap report view id as
          behavior metadata.
        seedKind: Support product.gap_led_next_search.clicked measurement by distinguishing cluster vs gap seed.
    subject:
      allowed:
        - viewerPrincipalId
        - documentId
    properties:
      required:
        - viewerPrincipalId
      optional:
        - documentId
        - seedKind
      forbidden:
        - token
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: command_handler
      cardinality: every_action
      identityKeys:
        - subject.viewerPrincipalId
        - subject.documentId
      emitter: trackGapLedNextSearchClicked
    sinks:
      amplitude: gap_led_next_search_clicked
  - name: product.research_auth_challenge.viewed
    version: 1
    owner: product
    actor: user
    surface: research-route
    storyRefs:
      experienceRef: experience:research-and-discovery
      momentRef: moment:search-results-first-review
      promiseRef: promise:search-results-fast-window
      aspectRefs: []
      acceptanceCheckRefs:
        - acceptance-check:search-results-fast-window-bootstrap-auth-challenge
      scenarioRefs:
        - scenario:research-auth-bootstrap-required
    observability:
      realitySignal: true
      signalMeaning: an expired or missing research session replaced the research shell with the authentication surface
      severity: warning
      requiredForPromiseCoverage: true
    trigger:
      source: client
      phase: completed
      timing: the shared research shell commits the authentication-required surface after bootstrap returns 401 or reports a
        stale Scholar session; SDK identity initialization is attempted before delivery
    measurement:
      purpose: Detect how often stale or missing sessions interrupt research routes and expose the authentication recovery
        surface.
      decisionUse: Compare challenge views with route errors and repeated challenges to detect broken session cleanup or
        recovery regressions.
      propertyPurposes:
        source: Identify the bounded runtime signal that caused the authentication challenge without collecting route content.
    subject:
      allowed: []
    properties:
      required:
        - source
      optional: []
      forbidden:
        - token
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: viewed_boundary
      cardinality: state_transition
      identityKeys:
        - properties.source
      emitter: trackResearchAuthChallengeViewed
    sinks:
      amplitude: research_auth_challenge_viewed
  - name: governance.invited_access_membership.synced
    version: 1
    owner: governance
    actor: operator
    surface: admin
    storyRefs:
      experienceRef: experience:operator-access-governance
      momentRef: moment:invited-user-access-management
      promiseRef: promise:invited-user-access-management
      aspectRefs:
        - aspect:admin-access-control
      acceptanceCheckRefs:
        - acceptance-check:invited-user-access-management-admin-surface
      scenarioRefs: []
    observability:
      realitySignal: true
      signalMeaning: an internal operator committed an invited-access membership add or remove
      severity: info
      requiredForPromiseCoverage: true
    trigger:
      source: server
      phase: committed
      timing: the invited-access Server Action emits after the database membership mutation succeeds
    measurement:
      purpose: Observe committed invited-access membership operations without collecting the invited email.
      decisionUse: Compare add and remove operation volume when reviewing access-governance use.
      propertyPurposes:
        operation: Distinguish add and remove commits without collecting the invited email.
    subject:
      allowed: []
    properties:
      required:
        - operation
      optional: []
      forbidden:
        - token
        - email
        - invitedEmail
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: command_handler
      cardinality: every_action
      identityKeys:
        - actor.id
        - properties.operation
      emitter: trackAdminInvitedAccessMembershipSynced
    sinks:
      amplitude: invited_access_membership_synced
propertySchemas:
  gap_report_id:
    description: Opaque persisted gap report identity used to correlate one explicit recovery action.
    type: string
    examples:
      - 11111111-1111-4111-8111-111111111111
    sensitivity: behavior_metadata
    contextGroup: action
    lifetime: route_view
    sourceOwner: persisted gap report route
  retry_count:
    description: One-based ordinal of an accepted-or-requested explicit enrichment retry for the report.
    type: integer
    examples:
      - 1
    sensitivity: behavior_metadata
    contextGroup: action
    lifetime: event
    sourceOwner: gap enrichment retry command
    range:
      min: 1
      max: 1000
  journey_context_id:
    description: Opaque identity for the search journey that owns the current action.
    type: string
    examples:
      - search-view-a1
    sensitivity: behavior_metadata
    contextGroup: journey
    lifetime: journey
    sourceOwner: shared search transition owner
  search_context_id:
    description: Opaque identity for one canonical query, filter, sort, and library snapshot.
    type: string
    examples:
      - search-view-a1
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: shared search transition owner or direct route fallback
  parent_search_context_id:
    description: Opaque identity of the search context from which a new query was submitted.
    type: string
    examples:
      - search-view-parent
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: shared search transition owner
  entry_source:
    description: Product surface or follow-up command that initiated the search.
    type: string
    examples:
      - route_bar
      - requery
    sensitivity: behavior_metadata
    contextGroup: action
    lifetime: event
    sourceOwner: search command handler
    enum:
      - route_bar
      - empty_entry
      - requery
      - term
      - position
      - similar
  query_length:
    description: Character count of the submitted query without query content.
    type: integer
    examples:
      - 24
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: canonical search input
    range:
      min: 1
      max: 1000
  sort:
    description: Ranking mode applied to the search context.
    type: string
    examples:
      - interest
      - relevance
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: canonical search input
    enum:
      - interest
      - relevance
      - citation_count
      - year
      - year_asc
      - unknown
  year_filter:
    description: Normalized publication-year range without query content.
    type: string
    examples:
      - 2020-2026
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: canonical search input
  personalization_enabled:
    description: Historical compatibility property for whether the retired selectable personalization mode was active.
    type: boolean
    examples:
      - true
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: canonical search input
  library_grounding_applied:
    description: Whether the visible result window actually incorporated library-proximity evidence.
    type: boolean
    examples:
      - true
      - false
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: committed search result metadata
  library_anchor_paper_count:
    description: Count of library anchor papers used by the search context.
    type: integer
    examples:
      - 0
      - 12
    sensitivity: behavior_metadata
    contextGroup: search
    lifetime: search_context
    sourceOwner: search result metadata
    range:
      min: 0
      max: 10000
  result_count:
    description: Total result count reported for the search context.
    type: integer
    examples:
      - 20
    sensitivity: behavior_metadata
    contextGroup: result
    lifetime: route_view
    sourceOwner: search result metadata
    range:
      min: 0
      max: 100000
  visible_result_count:
    description: Count of usable results visible at the first viewed boundary.
    type: integer
    examples:
      - 10
    sensitivity: behavior_metadata
    contextGroup: result
    lifetime: route_view
    sourceOwner: search result renderer
    range:
      min: 0
      max: 10000
  paper_id:
    description: Stable scholarly-provider identity for the paper acted on.
    type: string
    examples:
      - paper-1
    sensitivity: behavior_metadata
    contextGroup: paper
    lifetime: event
    sourceOwner: paper metadata
  seed_paper_id:
    description: Stable identity for the paper that seeded a follow-up search.
    type: string
    examples:
      - paper-seed
    sensitivity: behavior_metadata
    contextGroup: paper
    lifetime: search_context
    sourceOwner: follow-up command
  result_rank:
    description: One-based position of the paper in the visible ordering.
    type: integer
    examples:
      - 1
    sensitivity: behavior_metadata
    contextGroup: result
    lifetime: route_view
    sourceOwner: paper card renderer
    range:
      min: 1
      max: 100000
  source_surface:
    description: Research surface that exposed the action.
    type: string
    examples:
      - search_results
    sensitivity: behavior_metadata
    contextGroup: action
    lifetime: event
    sourceOwner: research route renderer
    enum:
      - search_results
      - citation_lineage
      - graph_neighbors
  has_pdf:
    description: Whether a usable PDF handoff was available.
    type: boolean
    examples:
      - true
    sensitivity: behavior_metadata
    contextGroup: paper
    lifetime: event
    sourceOwner: paper metadata
  evidence_availability:
    description: Whether citation or reference evidence was available.
    type: string
    examples:
      - available
    sensitivity: behavior_metadata
    contextGroup: paper
    lifetime: event
    sourceOwner: paper metadata
    enum:
      - available
      - partial
      - unavailable
      - unknown
  open_target:
    description: Destination class without collecting its URL.
    type: string
    examples:
      - moonlight_external
    sensitivity: behavior_metadata
    contextGroup: action
    lifetime: event
    sourceOwner: PDF handoff command
    enum:
      - moonlight_external
  open_element:
    description: Rendered element that initiated the handoff.
    type: string
    examples:
      - pdf_button
    sensitivity: behavior_metadata
    contextGroup: action
    lifetime: event
    sourceOwner: paper card renderer
    enum:
      - pdf_button
  reference_count:
    description: Known reference-side evidence count.
    type: integer
    examples:
      - 0
    sensitivity: behavior_metadata
    contextGroup: paper
    lifetime: event
    sourceOwner: paper metadata
    range:
      min: 0
      max: 1000000
  citation_count:
    description: Known citation-side evidence count.
    type: integer
    examples:
      - 0
    sensitivity: behavior_metadata
    contextGroup: paper
    lifetime: event
    sourceOwner: paper metadata
    range:
      min: 0
      max: 1000000
