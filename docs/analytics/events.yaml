      scenarioRefs:
        - scenario:search-english-term-discovery
    observability:
      realitySignal: true
      signalMeaning: a matching route view displayed the closed background research-term extraction result and recorded how
        many LLM method/contribution candidates were accepted
      severity: info
      requiredForPromiseCoverage: false
    trigger:
      source: client
      phase: completed
      timing: the term-discovery background task patches the matching current route view with the closed extraction result
    measurement:
      purpose: Measure how often the compact LLM research-term extraction reaches the visible route view with candidates
        versus an honest zero-candidate no-answer.
      decisionUse: Watch accepted-candidate rates after reducing prompt input; a rising zero-candidate share reopens
        term-quality or prompt-budget work before tuning ranking details.
      propertyPurposes:
        ownerPrincipalId: Scope the served research-term list to the route owner.
        documentId: Identify the route-owned search view that displayed the served list.
        phase: Record the extraction lifecycle phase. Current production emits initial only.
        source: Record the extraction source. Current production emits llm only; zero candidates mean no-answer, not fallback.
        candidateCount: Record how many accepted terms were served, including an honest zero.
    subject:
      allowed:
        - ownerPrincipalId
        - documentId
    properties:
      required:
        - ownerPrincipalId
        - documentId
        - phase
        - source
        - candidateCount
      optional: []
      forbidden:
        - token
        - query
        - term
    privacy:
