      acceptanceCheckRefs:
        - acceptance-check:search-results-suggest-english-terms-prefilled-search
      scenarioRefs:
        - scenario:search-english-term-discovery
    observability:
      realitySignal: true
      signalMeaning: user clicked a search-term follow-up text link in an AI comment and started a follow-up search
      severity: info
      requiredForPromiseCoverage: false
    trigger:
      source: client
      phase: completed
      timing: Research term text link is clicked from a search, citation-lineage, or graph-neighbor AI comment
    measurement:
      purpose: Measure whether AI-comment research terms help researchers continue a search from Korean, uncertain wording, or
        a paper-led relationship document while keeping this event owned by the search-term follow-up promise.
      decisionUse: Compare candidate clicks with follow-up result views by sourceResearchRouteKind to tune term ranking and
        no-answer thresholds.
      propertyPurposes:
        ownerPrincipalId: Scope the follow-up term action to one route-owned research route payload.
        documentId: Identify the source route-owned view without storing result text.
        queryHash: Compatibility-only unkeyed FNV-1a grouping key for source search intents; it is collision- and
          dictionary-prone, not anonymity, user identity, or a cross-event join key.
        termHash: Compatibility-only unkeyed FNV-1a grouping key for clicked research terms; it is collision- and
          dictionary-prone, not anonymity, user identity, or a cross-event join key.
        candidateType: Compare direct, broader, narrower, and variant candidates.
        supportCount: Separate weak clues from well-supported candidates.
        candidateSource: Record that the clicked search-term candidate came from the LLM method/contribution extraction path
          when available.
        sourceResearchRouteKind: Separate search, citation-lineage, and graph-neighbor AI comment term-click behavior.
    subject:
      allowed:
        - ownerPrincipalId
        - documentId
    properties:
      required:
        - ownerPrincipalId
        - documentId
        - queryHash
        - termHash
        - candidateType
        - supportCount
        - sourceResearchRouteKind
      optional:
        - candidateSource
      forbidden:
        - token
        - query
        - term
        - rawQuery
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: command_handler
      cardinality: every_action
      identityKeys:
        - subject.ownerPrincipalId
        - subject.documentId
        - properties.termHash
      emitter: trackSearchTermCandidateClicked
    sinks:
      amplitude: search_term_candidate_clicked
  - name: product.research_terms.viewed
    version: 1
    owner: product
    actor: user
    surface: research-route
    storyRefs:
