events:
  - name: search_submitted
    version: 3
    owner: product
    actor: user
    surface: research-route
    storyRefs:
      experienceRef: experience:research-and-discovery
      momentRef: moment:search-query-route-transition
      promiseRef: promise:search-query-route-transition
      relatedPromiseRefs:
        - promise:research-route-cap-feedback
        - promise:search-results-fast-window
      aspectRefs: []
      acceptanceCheckRefs: []
      scenarioRefs:
        - scenario:search-initial-visible-window
    observability:
      realitySignal: true
      signalMeaning: a search transition was accepted with a new search context
      severity: info
      requiredForPromiseCoverage: false
    trigger:
      source: client
      phase: requested
      timing: the client accepts a search transition and creates its search context
    measurement:
      purpose: Measure accepted search starts without collecting query content.
      decisionUse: Join accepted searches to later result views and paper actions in the same journey.
      propertyPurposes:
        journey_context_id: Join the event to its opaque search journey root without collecting query content.
        search_context_id: Join the event to one query, filter, sort, and library snapshot.
        entry_source: Distinguish the product command that initiated the accepted search.
        query_length: Compare short and complex search starts without storing query content.
        sort: Separate accepted and visible searches by normalized ranking mode.
        parent_search_context_id: Link a requery to the immediately preceding search context in the same journey.
        year_filter: Separate time-bounded searches from searches without a publication-year constraint.
        seed_paper_id: Distinguish seed-paper follow-up searches from free-form searches.
    subject:
      allowed:
        - search_context_id
    properties:
      required:
        - journey_context_id
        - search_context_id
        - entry_source
        - query_length
        - sort
      optional:
        - parent_search_context_id
        - year_filter
        - seed_paper_id
      forbidden:
        - token
        - query
        - raw_query
        - query_hash
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: command_handler
      cardinality: once_per_identity
      identityKeys:
        - properties.search_context_id
      emitter: trackSearchSubmitted
    sinks:
      amplitude: search_submitted
  - name: search_results_viewed
    version: 2
    owner: product
    actor: user
    surface: research-route
    storyRefs:
      experienceRef: experience:research-and-discovery
      momentRef: moment:search-results-first-review
      promiseRef: promise:search-reaction-summarizes-terrain
      aspectRefs: []
      acceptanceCheckRefs: []
      scenarioRefs:
        - scenario:search-view-reaction-respond-format
    observability:
      realitySignal: true
      signalMeaning: the first usable result window became visible
      severity: info
      requiredForPromiseCoverage: false
    trigger:
      source: client
      phase: completed
      timing: the destination view renders its first usable result window
    measurement:
      purpose: Measure whether an accepted search reaches usable results.
      decisionUse: Join result delivery to the accepted search and subsequent paper actions.
      propertyPurposes:
        journey_context_id: Join the event to its opaque search journey root without collecting query content.
        search_context_id: Join the event to one query, filter, sort, and library snapshot.
        sort: Separate accepted and visible searches by normalized ranking mode.
        result_count: Separate empty, sparse, and dense committed result sets.
        visible_result_count: Record the usable result window exposed at the viewed boundary.
        library_grounding_applied: Distinguish visible result windows that actually incorporated library-proximity evidence.
        library_anchor_paper_count: Measure how many reviewed-paper anchors informed the visible result set.
        source_surface: Separate actions originating in search results from relationship-derived surfaces.
        year_filter: Separate time-bounded searches from searches without a publication-year constraint.
    subject:
      allowed:
        - search_context_id
    properties:
      required:
        - journey_context_id
        - search_context_id
        - sort
        - result_count
        - visible_result_count
        - library_grounding_applied
        - library_anchor_paper_count
        - source_surface
      optional:
        - year_filter
      forbidden:
        - token
        - query
        - raw_query
        - query_hash
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: viewed_boundary
      cardinality: once_per_identity
      identityKeys:
        - properties.search_context_id
      emitter: trackSearchResultsViewed
    sinks:
      amplitude: search_results_viewed
  - name: paper_saved
    version: 1
    owner: product
    actor: user
    surface: research-route
    storyRefs:
      experienceRef: experience:research-and-discovery
      momentRef: moment:search-results-first-review
      promiseRef: promise:search-result-library-add
      aspectRefs: []
      acceptanceCheckRefs:
        - acceptance-check:search-result-library-add-card-action
        - acceptance-check:search-result-library-add-analytics
      scenarioRefs:
        - scenario:search-result-library-add
    observability:
      realitySignal: true
      signalMeaning: a paper was successfully added to the library
      severity: info
      requiredForPromiseCoverage: false
    trigger:
      source: client
      phase: completed
      timing: the reviewed-paper mutation succeeds and local library state commits
    measurement:
      purpose: Measure successful paper saves.
      decisionUse: Treat a save as a product outcome proxy, not proof of user value.
      propertyPurposes:
        journey_context_id: Join the event to its opaque search journey root without collecting query content.
        search_context_id: Join the event to one query, filter, sort, and library snapshot.
        paper_id: Join paper actions to one stable published-paper identity without collecting its title.
        result_rank: Compare paper actions by the paper's one-based visible result position.
        source_surface: Separate actions originating in search results from relationship-derived surfaces.
        has_pdf: Compare paper actions by whether a direct PDF handoff was available.
        evidence_availability: Separate actions by full, partial, unavailable, or unknown citation evidence.
    subject:
      allowed:
        - search_context_id
        - paper_id
    properties:
      required:
        - journey_context_id
        - search_context_id
        - paper_id
        - result_rank
        - source_surface
        - has_pdf
        - evidence_availability
      optional: []
      forbidden:
        - token
        - query
        - raw_query
        - query_hash
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: state_transition
      cardinality: every_action
      identityKeys:
        - properties.search_context_id
        - subject.paper_id
      emitter: trackPaperSaved
    sinks:
      amplitude: paper_saved
