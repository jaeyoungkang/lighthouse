  - name: product.search_language_aware_library_supplement.viewed
    version: 1
    owner: product
    actor: user
    surface: research-route
    storyRefs:
      experienceRef: experience:research-and-discovery
      momentRef: moment:search-results-first-review
      promiseRef: promise:search-nonascii-library-relevance
      aspectRefs:
        - aspect:library-grounded-research
      acceptanceCheckRefs:
        - acceptance-check:search-nonascii-library-relevance-korean-overlap
      scenarioRefs:
        - scenario:search-nonascii-library-relevance
    observability:
      realitySignal: true
      signalMeaning: a language-aware library-near supplement was admitted into a visible search result set
      severity: info
      requiredForPromiseCoverage: false
    trigger:
      source: client
      phase: committed
      timing: an interest-sort committed search result set includes at least one language-aware library-near supplement admitted under the current query
    measurement:
      purpose: Measure whether non-ASCII searches receive genuinely related library-near supplements without storing raw query text.
      decisionUse: Compare non-ASCII personalized searches with visible supplement admission to evaluate Korean library value without weakening over-display guards.
      propertyPurposes:
        ownerPrincipalId: Scope the visible supplement admission to one route-owned research route payload.
        documentId: Identify the route-owned search view whose visible result set admitted the supplement.
        queryHash: Compatibility-only unkeyed FNV-1a grouping key for repeated non-ASCII searches; it is collision- and
          dictionary-prone, not anonymity, user identity, or a cross-event join key.
        queryLength: Distinguish short and complex non-ASCII searches without storing query text.
        sort: Confirm the admission happened under the displayed ranking mode.
        resultCount: Separate sparse and dense visible result sets.
        admittedSupplementCount: Count how many language-aware library-near supplements were admitted in the visible result set.
    subject:
      allowed:
        - ownerPrincipalId
        - documentId
    properties:
      required:
        - ownerPrincipalId
        - documentId
        - queryHash
        - queryLength
        - sort
        - resultCount
        - admittedSupplementCount
      optional: []
      forbidden:
        - token
        - query
    privacy:
      level: behavior_metadata
      allowExternalSinks: true
    emission:
      boundary: state_transition
      cardinality: once_per_identity
      identityKeys:
        - subject.ownerPrincipalId
        - subject.documentId
        - properties.queryHash
        - properties.sort
      emitter: trackSearchLanguageAwareLibrarySupplementViewedOnce
    sinks:
      amplitude: search_language_aware_library_supplement_viewed
