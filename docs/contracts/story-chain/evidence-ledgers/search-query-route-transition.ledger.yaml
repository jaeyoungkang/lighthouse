  - key: promise:search-query-route-transition#acceptance-check:search-query-route-transition-immediate-submit
    assertion: 'vitest @ `app/components/research/__tests__/ResearchRouteSearchBar.test.tsx` ("navigates immediately to the search entry route on submit"; "does not activate when submitting the exact current entry URL"; "pushes a new query route while keeping provider processing destination-owned") + `app/(research)/__tests__/research-routes.test.tsx` ("streams a route-owned processing view at the same /search?q= address"; "leaves an unauthenticated query unresolved for the shared shell auth challenge"; "renders the /search?q= destination pending view through the real layout without auth") + `app/(research)/__tests__/layout.test.tsx` ("renders the search-first research shell without server auth gating"; "does not put user resolution on the layout first-paint path") + `app/components/research-route-renderers/__tests__/search-view-states.test.tsx` ("renders a query pending route as processing instead of zero-result search output"). 결과가 있는 검색 route의 상단 route 입력창에서 새 query를 제출하면 확인 배너 없이, 서버 왕복도 기다리지 않고 즉시 `/search?q=` entry route로 전환한다. origin shell은 클릭 receipt activation만 가질 수 있고 provider 진행·성공·실패를 소유하지 않는다. shared research layout은 auth를 기다리지 않고 shell/children을 먼저 반환하며, destination route는 current-user 해석과 provider 검색보다 먼저 route-owned pending 검색 상태를 같은 조건 주소에서 스트리밍한다. 인증되지 않은 resolved query child는 실행하지 않고 비워 두며 post-mount bootstrap 401 뒤 공용 shell이 auth challenge를 소유한다(aspect:immediate-navigation). Pending 검색 payload가 `total: 0`과 빈 `papers`를 들고 있어도 SearchView는 완료된 0건 결과 header/list나 빈 첫 검색 화면을 렌더하지 않고 `role="status"` processing surface를 렌더한다. Layout composition test는 auth promise가 끝나지 않아도 실제 layout → shell → page fallback tree가 pending view를 렌더함을 잠근다. 같은 route로 다시 제출하면 activation도 만들지 않는다.'
    executionRefs:
      - execution:run-002
      - execution:run-003
    scenarios:
      - scenario:search-query-route-transition-recovery
  - key: promise:search-query-route-transition#acceptance-check:search-query-route-transition-submit-feedback
    assertion: vitest @ `app/components/research/__tests__/ResearchRouteSearchBar.test.tsx` ("navigates immediately to the search entry route on submit"; "does not activate when submitting the exact current entry URL"; "clears the route-bar button activation when navigation throws synchronously") + `app/components/research-route-renderers/__tests__/search-view-content.test.tsx` ("submits the initial search without a result-basis parameter"; "clears the first-search button activation when navigation throws synchronously") + `app/components/research/__tests__/research-route-shell.test.tsx` ("clears keyword activation feedback after the destination route arrives") + `app/components/research/__tests__/search-followup-activation.test.tsx` (activation identity, bounded timeout, and unmount cleanup). 첫 검색 화면과 연구 화면 상단의 `논문검색` 버튼은 새 조건 route로 이동을 시작한 직후 회전 표시, `aria-busy`, 비활성 상태를 함께 보여 준다. 버튼 상태는 shell-scoped activation에서 파생하며 목적지 처리 상태를 소유하지 않는다. 같은 route 재제출은 버튼 상태를 만들지 않고, 목적지 도착·동기 호출 실패·bounded timeout은 현재 activation만 정리한다.
    executionRefs:
