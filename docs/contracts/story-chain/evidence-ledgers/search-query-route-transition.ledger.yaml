    assertion: 'vitest @ `app/api/search/__tests__/route.helpers.test.ts` ("clears the route AI comment so fresh route AI comment generation can describe the new query") + `app/stores/__tests__/research-route-store.ai-comment-cards.test.ts` ("clears stale local reaction history when hydration returns no persisted reaction"). 새 query 실행 payload는 이전 결과의 반응을 새 결과 문서로 따라오게 하지 않고, transition patch가 `reaction: null`·`reactionHistory: []`를 쓰며, strict server-truth hydration이 예전 AI 반응 history를 되살리지 않음을 단언한다.'
