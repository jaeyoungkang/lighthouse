implementationContracts:
  - "`docs/design-standards.md` owns the semantic role definitions and value judgment; `app/globals.css` owns their executable typography and color values."
  - Research route surfaces consume the shared semantic role classes instead of inventing route-local font-size or undefined color aliases for the same role.
  - The Aspect does not replace paper-card hierarchy, AI comment frame, content-width, or progressive spatial-stability ownership.
  - Desktop and narrow rendered review checks relative hierarchy and computed styles; exact pixel values remain design-system implementation values rather than Story Chain thresholds.
verdict: met
