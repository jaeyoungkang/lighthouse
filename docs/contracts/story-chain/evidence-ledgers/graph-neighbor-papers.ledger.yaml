    assertion: vitest @ `app/components/research-route-renderers/__tests__/use-graph-neighbors-handler.test.tsx` ("navigates to the similar seed route and leaves execution to the destination"; "with forceRefetch re-runs the same seed route through route-owned replacement") + `app/components/research/__tests__/ResearchRouteRuntime.bootstrap.test.tsx` ("bootstraps graph-neighbor route AI comment generation for a hydrated similar-paper ResearchRoutePayload with no reaction block") + `app/components/research/__tests__/ResearchRouteRuntime.hydration-gating.test.tsx` ("waits for graph-neighbor card hydration and generates once with relationship authors") + `app/components/research/__tests__/research-route-runtime.bootstrap-events.test.ts` ("waits for graph-neighbor card hydration before building its generation command") + `app/lib/__tests__/view-snapshot.test.ts` ("keeps hydrated graph-neighbor authors in the relationship prompt") + `app/components/research/__tests__/route-ai-comment-generation-scheduler.test.ts`. 생성/reuse는 이전 검색 route runtime에서 opened generation을 소비하지 않고 seed route navigation에 맡긴다. 열린 route는 lightweight card hydration 동안 pending AI comment를 유지하고 보강 시도가 terminal ready가 된 route bootstrap에서 한 번만 targeted generation command를 보낸다. 성공적으로 받은 authors는 relationship snapshot에 포함하고, 보강 실패 시에는 유지된 lightweight 관계 근거를 사용한다. Degraded forceRefetch는 current degraded view를 유지한 채 seed route replacement를 요청하고, route-owned replacement가 만든 교체 view id로만 직접 targeted queueing된다.
    executionRefs:
      - execution:run-007
      - execution:run-008
      - execution:run-011
    scenarios:
      - scenario:graph-neighbor-axes-shown
  - key: promise:graph-neighbor-papers#acceptance-check:graph-neighbor-papers-seed-title-card-pinned
    assertion: vitest @ `app/components/research-route-renderers/__tests__/CitationLineageView.graph-neighbors.test.tsx` ("places the AI comment below the graph-neighbor title context"; "renders co-cited and coupled graph-neighbor sections with adjacency-count signals") + `app/components/research-route-renderers/__tests__/graph-neighbors-view.test.tsx` ("renders a degraded notice and a retry button when graphLoadFailed is true"; "renders the honest-empty message when both axes are empty and not failed") + `app/components/research/__tests__/ResearchRouteLayout.narrow.test.tsx` ("keeps relationship route AI comments inline below the seed context on narrow viewports") + browser evidence @ `scripts/evidence-ledger/relationship-seed-sticky-browser-check.mjs`. Asserts graph_neighbors renders a sticky, background-style seed context header with the source paper title and guide before the AI comment and co-cited/coupled axes, preserves that header in degraded and honest-empty states, keeps inline relationship reactions in the document flow below the seed context, and verifies actual sticky scroll behavior in Chrome.
