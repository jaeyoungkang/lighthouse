    assertion: vitest @ `app/components/research-route-renderers/__tests__/CitationLineageView.graph-neighbors.test.tsx` ("renders graph-neighbor list items with the same visible card hierarchy as search results") + `app/components/research-route-renderers/__tests__/paper-card-derived-followup-parity.test.tsx` ("routes different-position searches from citation_lineage paper cards in the current window"; "routes different-position searches from graph_neighbors paper cards in the current window"; "opens modified different-position searches from citation_lineage paper cards in a new window"; "opens modified different-position searches from graph_neighbors paper cards in a new window"; "opens middle-click different-position searches in a new window") + `app/components/research-route-renderers/__tests__/search-view-followup-handlers.test.tsx` ("opens a different-position query without source provenance"; "carries known library availability without a result-basis preference"; "drops retired basis state on keyword routes"). 그래프 이웃·인용 계보 반복 리스트 카드가 검색 결과 카드 fixture와 같은 panel/title class, 비조작 영역 전체 disclosure, icon-only 접근성 state, explicit-action isolation, 연도→venue→분야 metadata 행과 최대 세 명을 기본 표시하는 저자 행, DOI/PDF/citation/similar action row, inline-analysis 위치를 렌더한다. 인라인 분석 `다른 입장` 후보도 같은 search-term handler로 서버 왕복 없이 즉시 query-only `/search?q=` route로 이동하며 destination route가 URL 조건에서 검색을 실행한다. plain click은 현재 창을 push하고, Ctrl/Cmd/가운데 클릭은 같은 entry URL을 새 탭으로 연다. 출발 논문·입장·쟁점, legacy selected library ids, retired personalize preference는 운반하지 않는다 (`onOpenCitationLineage` + `onOpenGraphNeighbors` + `onSearchTerm` thread, aspect:paper-card-presentation-consistency).
