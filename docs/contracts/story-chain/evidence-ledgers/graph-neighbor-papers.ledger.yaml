implementationContracts:
  - The listed Promise(s) are verified by the Acceptance Check entries and structured executions on this ledger.
  - "`aspect:visible-explanation-sufficiency`: 전용 비슷한 논문 ResearchRoutePayload에서 근접도 수치(공동 인용 횟수 / 공유 참고문헌 수)와 각 축의 의미가 같은 surface 안에서 읽히고, provider가 주지 않은 축은 정직한 부재로 드러난다."
  - 각 그래프 축은 검색 결과 window와 같은 `SEARCH_RESULTS_INITIAL_VISIBLE_COUNT`(10) 정책으로 처음 10편만 보이고 더보기로 +10씩 펼친다. 더보기 버튼은 검색 결과와 동일한 `search.label.search-view-content.loadMore` `(보임/전체)` 라벨을 쓴다. window state는 축별로 분리되어 한 축의 더보기가 다른 축에 영향을 주지 않는다 (aspect:paper-card-list-windowing).
  - 그래프 이웃 카드는 검색 결과 카드와 같은 `SearchResultItem` 표현과 액션 세트를 노출하도록 `onOpenPdf`에 더해 `onOpenCitationLineage`(`useCitationLineageHandler`), `onOpenGraphNeighbors`(`useGraphNeighborsHandler`), `onSearchTerm`(`useSearchTermHandler`)을 thread한다. Evidence는 handler/action text뿐 아니라 panel class, title class, 연도→venue→분야 metadata 행과 최대 세 명을 기본 표시하는 저자 행, DOI/PDF/citation/similar action row, inline-analysis 위치를 검색 결과 카드 fixture와 직접 비교하고, `다른 입장` 후보 클릭이 출발 provenance 없는 query-only search route를 만드는지 확인한다 (aspect:paper-card-presentation-consistency; aspect:paper-card-action-loading-feedback).
  - 그래프 이웃의 경량 후보는 초기 응답 속도를 위해 E3 discovery 결과만으로 먼저 route-owned `graph_neighbors` view payload가 된다. 이때 metadata에는 `cardDataHydration.status = pending`을 남기고, `/similar?seedPaperId=...` 조건 route의 반복 리스트 카드는 검색 결과와 같은 `SearchResultItem`의 `paper detail hydration frame`으로 PDF/콘텐츠/분석 입력 보강 상태를 드러낸다. Background hydrate가 E3 paper reference를 `/api/v3/papers/batch` rich projection으로 보강해 abstract/venue/fields/open access/PDF/external ids를 채우면 같은 route view를 `ready` payload로 교체한다. 이 데이터 공급 계약이 빠지면 검색 결과 카드와 같은 인라인 분석 큐잉·표현을 보장할 수 없으므로, visible hierarchy parity와 별도의 서버/DOM/handler evidence로 닫는다.
  - 비슷한 논문 ResearchRoutePayload는 seed context header를 본문 상단에 sticky로 고정해 사용자가 어떤 논문과의 관계를 보고 있는지 잃지 않게 한다. 이 header는 반복 후보 리스트의 `SearchResultItem`이 아니라 배경형 ResearchRoutePayload 컨텍스트이며, seed 논문은 co-cited/coupled 후보 축 자체에서는 계속 제외된다.
  - Gap follow-up adapter는 provider 응답에 paper/source 중복이 있어도 snapshot 경계에서 이를 제거하고, 100명을 넘는 저자처럼 분석에 쓰이지 않는 예외 metadata를 제거한 뒤 co-cited/coupled source 동일성만 compact id로 전달한다. 이 방어는 `app/components/research-route-renderers/__tests__/search-view-agent-actions.test.ts`와 `app/api/gap-reports/__tests__/route.source-paper-ids.test.ts`에서 검증한다.
verdict: met
