  - key: promise:graph-neighbor-papers#acceptance-check:graph-neighbor-papers-card-data-hydration
    assertion: vitest @ `app/server/services/__tests__/episteme-literature.test.ts` ("posts the E3 search contract and accepts nullable relevance"; "hydrates stored numeric ids through E3 paper refs and rich projection") + `app/server/services/__tests__/graph-neighbor-papers.test.ts` ("marks empty graph-neighbor route payloads as ready instead of pending") + `app/server/domain-access/__tests__/graph-neighbor-hydration-access.test.ts` ("drops embedded analysis when hydrated paper input changes") + `app/components/research-route-renderers/__tests__/CitationLineageView.graph-neighbor-states.test.tsx` ("uses the shared paper-card detail loading frame while graph-neighbor card data hydrates") + `app/components/research/__tests__/ResearchBackgroundTasks.graph-neighbor-hydration.test.tsx` ("hydrates pending graph-neighbor card data from the background runner"; "settles pending graph-neighbor card data when hydration keeps failing"; "does not retry a correctable 400 with the same graph snapshot"; "preserves concurrent review state but drops analysis when hydration changes its input"; "settles graph hydration after abort-ignoring transports hit the bounded deadline") + `app/lib/__tests__/fetch-with-silence-timeout.test.ts` ("settles at the deadline even when the transport ignores abort"; "settles a body read when the upstream reader ignores abort"). 비슷한 논문은 co-cited/coupled page 결과로 lightweight route result를 먼저 렌더하고, 후보가 있으면 첫 paint 뒤 `ResearchBackgroundTasks`가 graph-neighbor hydrate route를 호출한다. 전용 ResearchRoutePayload 화면은 shared `SearchResultItem` 안에서 action row의 `PDF 확인 중`과 action row 아래 `paper detail hydration frame`을 보여 준다. 이 frame은 현재 표준 세 단계인 `논문 정보 보강 중`, `저자·초록 보강`, `분석 입력 보강`으로 카드 재료 보강 상태를 이름 붙인다. Background hydrate는 abstract/venue/fields/PDF/external ids를 current papers와 axes에 merge하고 reviewed state를 보존한다. 먼저 도착한 inline analysis는 hydration 뒤에도 canonical input이 같을 때만 보존하고, 입력이 달라지면 stale 분석을 버린 뒤 ready로 닫는다. 65초 silence rail은 fetch/body abort를 무시하는 transport도 `429`·`5xx`·timeout·transport loss에 한정된 최대 3회 retry로 넘긴다. Correctable/auth/conflict 응답은 같은 snapshot을 반복하지 않고 lightweight 후보를 유지한 채 `cardDataHydration.ready`로 닫는다. 빈 후보 route payload도 처음부터 ready로 닫아 `paper detail hydration frame`이 무한 지속되지 않게 한다.
    executionRefs:
      - execution:run-006
    scenarios:
      - scenario:graph-neighbor-axes-shown
