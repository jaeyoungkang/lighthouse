implementationContracts:
  - "Research-gap entry visibility is deterministic for search, citation-lineage, and graph-neighbor ResearchRoutePayloads with non-empty gap input, and the entry is host-owned on all three. Each ResearchRoutePayload host renders a text-style relationship-analysis action in its owned location (search: result-basis row with `상위 논문 40개의 관계를 분석하여 연구 공백 찾아보기 >`; citation-lineage / graph-neighbor: the inline reaction action row with `현재 논문 묶음의 관계를 분석하여 연구 공백 찾아보기 >`) when its metadata supplies gap input."
  - "`InlineAiCommentFrame` (`app/components/research/inline-ai-comment-frame.tsx`) renders the shared comment frame and the above-frame host-owned gap action for citation-lineage and graph-neighbor ResearchRoutePayloads; `CitationLineageView` / `GraphNeighborsView` decide visibility from ResearchRoutePayload metadata (references+citations / graph candidates) and route the action through `openGapNetworkFromCitationLineageCitations` / `openGapNetworkFromGraphNeighbors`."
  - "`SearchResultsHeader` owns the search gap action placement on the result-basis row; `SearchResultsOverviewBlockView` keeps compact search metadata focused on summary, while research-term exploration lives as AI comment text."
  - "`AgentPanel` renders only the AI comment title/body in this contract; the host-owned action is the single gap entry."
  - Route-owned route AI comment generation writes title/body state through the current ResearchRoutePayload store path and leaves gap follow-up ownership with the host renderer.
  - Once a host starts the shared gap request with a detached target, the target handoff continues independently of the source host's mounted lifetime. Source pending state remains presentation-only.
  - Graph-neighbor documents are valid gap-network sources. The gap-network server route and domain-access build path accept graph-neighbor snapshot papers rather than assuming every source id points to a persisted `search` or `citation_lineage` document.
verdict: met
