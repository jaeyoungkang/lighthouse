implementationContracts:
  - Repeated paper list items use the shared `SearchResultItem` card hierarchy.
  - Collapsed repeated cards use the shared responsive minimum-height class and stable metadata/author/action/analysis rows. Venue and visibly labeled fields share one compact metadata row. The author row shows up to three names by default, preserves author search on each name, and reveals the remainder inline through one persistent expand/collapse control; missing values show low-emphasis unavailable copy at the corresponding row. The DOI action shows only a fixed-width `DOI` label immediately before PDF; present identifiers use a link and absent identifiers use the same-width disabled control so later action anchors stay predictable. The exact `rem` value remains a design value in `docs/design-standards.md`, not an Aspect threshold.
  - A click on the repeated card's non-interactive region toggles inspection; a repeated click closes it. The title remains identification text rather than a button or navigation link. The compact chevron is icon-only visually and keeps the accessible name, `aria-expanded`, and controlled-region relationship. No visible `논문 정보 펼치기`/`접기` command or inspection tooltip is rendered.
  - Explicit links and controls inside the card, including DOI, PDF, citation, similar, author/topic/follow-up, and library actions, do not bubble into the card toggle.
  - Surface-specific context, such as graph adjacency chips, direction headings, seed-paper cards, or representative-paper cards, stays outside or above the repeated paper list. These top-level context cards are not repeated list cards; repeated paper list items must use the shared `SearchResultItem` hierarchy.
  - Inline analysis and AI feedback stay inside the shared card presentation rather than becoming surface-specific side panels.
  - Presentation parity includes upstream paper data quality and pending-state grammar. Citation-lineage relation items hydrate before the relationship `ResearchRoutePayload` is constructed; graph-neighbor relation items may open from lightweight page results first for speed, but pending graph-neighbor cards must keep the shared `SearchResultItem` hierarchy and move to the same batch metadata include set used by search results through background hydration. Otherwise a shared component can still render as a thinner card and fail inline-analysis parity.
verdict: met
