implementationContracts:
  - 'The route view model includes `"citation_lineage"` as a first-class relationship view; there is no `source: "citation"` variant of `SearchMetadata`.'
  - "`CitationLineageMetadata.referenceIds` / `citationIds` are the authoritative classification signal once a citation_lineage view resolves. New Episteme search results may have counts and availability metadata before IDs are loaded; route execution resolves IDs from lazy citation pages."
  - The `citation_lineage` prompt context is built from the route-view `viewSnapshot` with explicit batch-hydrated seed, reference, citation, availability, and bounded abstract-evidence fields — distinct from the search snapshot's top-results list.
  - Citation evidence includes the seed plus at most three references and three citations with 600-character normalized snippets. Both direction quotas are equal, evidence changes participate in canonical projection identity, and search hydration abstracts remain outside the search reaction basis.
  - Citation generation connects prior method/topic evidence through the seed to later extension/application evidence. It treats missing direction evidence as an explicit limitation and may not infer relationship nature from titles, years, counts, or availability alone.
  - "`buildViewSnapshotPromptContext` routes `citation_lineage` by snapshot type at the top level, not as a nested subsection of the search case."
  - AI reactions for `citation_lineage` render title + body; the gap entry is the host-owned `연구 공백 지도 만들기` action above and outside the top AI comment frame (not an AI-reaction follow-up surface) when 선행/후속 입력이 있다.
  - Inside the citation view, `splitPapersByCitationDirection` exposes direction-separated sections (`references` / `citations`) so grounding happens locally without going through an LLM tool.
  - "The references and citations sections use the shared paper-card list windowing policy: initial 10 cards, `더보기 (N/M)`, +10 per click, section-local state (aspect:paper-card-list-windowing)."
  - The references and citations sections render the same shared paper card as search results and graph-neighbor axes, preserving the title then year→venue→fields metadata, author, action-row, and inline-analysis placement (aspect:paper-card-presentation-consistency).
  - The seed context header stays sticky above references/citations sections and is intentionally outside the repeated-list card grammar. It uses a background/border header treatment, not a candidate-card panel, while repeated direction papers continue to use `SearchResultItem`.
  - Lazy E3 citation pages provide rich paper projections for repeated cards. The citation-lineage execution maps those direction papers directly into the `ResearchRoutePayload`; unresolved edge projections are omitted with truncated availability rather than failing the entire direction.
  - The citation_lineage ResearchRoutePayload body is scoped to direct citation directions only. Graph relation axes are opened from the card-level `비슷한 논문` action and rendered only by `graph_neighbors`.
verdict: met
