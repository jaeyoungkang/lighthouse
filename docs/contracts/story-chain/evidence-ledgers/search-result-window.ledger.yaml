implementationContracts:
  - "`SEARCH_RESULTS_INITIAL_VISIBLE_COUNT` remains the user-facing first window size, is value-pinned to `10`, and is consumed by the search ResearchRoutePayload controller/store path that expands or resets the visible result window (aspect:paper-card-list-windowing). The same value is reused by citation-lineage and graph-neighbor paper-card lists in their own ledgers."
  - Single-query default relevance results stay within the Episteme loaded result window and preserve Episteme provider order. Multi-query relevance results merge the loaded provider windows for each condition and must be described as a condition-merged result. Explicit user-selected citation/year sorts keep the selected sort semantics inside the loaded provider window.
  - "Query clause normalization on the search critical path stays deterministic and does not import LLM generation helpers. 콤마가 포함된 복합 주제와 정식 논문 제목은 모두 하나의 검색 의도로 유지한다. `;`와 줄바꿈만 명시적인 query clause 구분자로 사용한다. 명시적으로 나뉜 여러 clause는 condition-merged provider 결과로 표시한다. Boilerplate lead-phrase stripping(`Towards `, `A Survey of `)은 콤마가 포함된 단일 query에도 같은 방식으로 적용한다(`app/lib/search-query.ts`, issue #525)."
  - 'Spelling correction stays outside the initial search critical path: the search service returns original-query results first, and existing route/view vitest evidence covers the post-result metadata update path. The correction suggestion shows both original and corrected query before the user chooses it. Choosing it commits the corrected query through the route-owned `/search?q=` execution model (the same `onRouteSearchCommit` the main search bar uses, carrying current sort/year without a retired basis parameter), not a legacy local re-search, so the loaded document and top route input reflect the corrected query at its canonical `/search?q=` route and browser history — not an in-app restore action — owns the return path. Correction is best-effort: `resolveSearchSpellingCorrection` returns `null` (no `spellingCorrection` metadata written, no suggestion or degraded copy rendered) when the LLM key is absent, the call times out/fails, no clear typo exists, or the correction normalizes to the original query. Silence is honest because "no typo" and "could not correct" are the same state to the user; it creates no visible explanation surface and so falls outside `aspect:visible-explanation-sufficiency`.'
  - 'Research term discovery uses the loaded result title/abstract plus current inline-analysis context as the anchored LLM input for method/contribution noun-phrase candidates, with a compact prompt budget of 12 papers and 300 abstract characters per paper. Legacy-version, fingerprint-free, failure-placeholder, missing-abstract, and whitespace-only embedded analyses do not enter the prompt or method-support count. The LLM extraction does not run on the search critical path: `buildSearchViewPayload` commits `englishTermDiscovery.status="pending"`, and the background route `POST /api/search/term-discovery` closes the single `initial` phase to `status="ready"` with `source:"llm"`. A `bounded` background timeout (`TERM_CANDIDATE_LLM_TIMEOUT_MS`, off-critical-path) and `TERM_CANDIDATE_LLM_MAX_OUTPUT_TOKENS` bound the call. No-key/failure/timeout and filtered-empty results close as an honest empty `llm` result; the deterministic topic-profile candidate generator and `analysis_upgrade` phase are not production paths. A search-usefulness filter still runs before rendering: query-equivalent labels, broad field labels, broad method labels, and one-word general terms are not enough for the research-term suggestion text; LLM-specific multi-word method/contribution phrases are allowed to contain otherwise broad umbrella tokens when the phrase is concrete. First-payload library graph support boosts priority and basis copy for existing terms supported by graph-scored papers, but it does not expand candidates outside the loaded result sample and does not synthesize terms over a pending or honest-no-answer document. Background term discovery never calls the graph provider; it preserves the fixed first-payload evidence, counts against full support ids, annotates basis, and reorders graph-supported candidates. A late `mergeSearchMetadataWithExistingEnrichments` snapshot keeps the closed discovery state instead of regressing it to pending. The research-term text renders inside the AI comment as clickable term text embedded in a sentence, shows an extracting state while pending, and keeps graph-aware basis in candidate data rather than adding a separate chip row or degraded fallback note. It does not expose gap scores, bridge claims, or a final translation judgment. Method/contribution family presence on the real `slide accessibility` result is locked by the gated reproduction eval `npm run eval:term-discovery`.'
  - Progressive hydration is a post-commit card-detail enrichment. Unified search fixes the combined keyword-plus-library-neighbor membership and score order in the first payload; background hydration never adds candidates, changes result order, or changes the positive-library-evidence `내 연구와 가까움` marker. Ordinary keyword searches still carry `metadata.abstractHydration.status:"pending"` and DOI exact lookup still skips that marker. `ResearchBackgroundTasks` calls `POST /api/search/enrichment` only after the route-owned search snapshot itself is `status:"ready"` and contains hydrate-capable E3 paper references. The enrichment path hydrates only committed result references through `/api/v3/papers/batch`, preserves each committed identity and first-revealed library metadata, and merges only when the current route payload id and paper-id order still match. Stored snapshots may still carry `libraryBlendPolicy`, `libraryOnlyPaperIds`, or graph support; their readers preserve that compatibility state. Pending hydration suppresses inline analysis and term discovery. Facet-neutral route AI comment generation may use the committed first-payload result basis; 저자·분야·venue·PDF facet이 활성화되면 hydration이 `ready`가 되어 current facet projection이 고정될 때까지 generation을 pending으로 유지하고, terminal projection이 비어 있으면 provider 요청 없이 닫는다.
  - Repeated search cards use the shared responsive collapsed-card minimum-height class and stable metadata, author, action, and analysis rows. Hydration, metadata-only, not-started, progress, error, and settled output stay in the same analysis region. Missing abstracts use visible fields only as a limited clue and do not infer content from author identity; an available abstract without an actual task does not fabricate a queued state. The exact height value is owned by `docs/design-standards.md` and the shared code constant rather than this ledger.
  - "`aspect:library-grounded-research`의 내부 reviewed_papers source와 자동 통합 projection은 `library-grounded-research.ledger.yaml`에서 닫는다. 이 ledger의 `result-basis-visible` entry는 최초 검색 전 화면과 route command에 별도 적용 control이 없고, 내부 reviewed_papers 목록 UI는 표시할 수 있으며, 완료된 결과 header는 실제 라이브러리 반영 여부만 설명하고 기준 토글·탭은 만들지 않는다는 연결을 담는다."
verdict: met
