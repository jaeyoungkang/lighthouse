ibrary order on the right, while omitted utilities do not reserve empty placeholders. Missing metadata renders as low-emphasis `출처 정보 없음`, `분야 정보 없음`, or `저자 정보 미제공` at the corresponding row instead of becoming blank gaps; a missing year creates no placeholder. The fixed-width DOI slot shows only `DOI`: it links to the identifier when present and remains a same-width disabled control when absent, keeping PDF and citation anchors predictable without exposing the identifier text. Collapsed titles stay on one line and completed summaries use at most two lines; the source label is absent until expansion. Actual title overflow exposes card inspection even without analysis, and expanded content returns to natural height only after the user acts. Pending, error, metadata-only, not-started, and settled states replace content inside one generated region; missing or whitespace-only abstracts never fabricate queued analysis and use only visible fields as a constrained clue without a separate `메타데이터 단서` heading. PDF hydration, citation signal, and provider metadata preservation keep their existing behavior (aspect:paper-card-presentation-consistency; aspect:paper-card-action-loading-feedback; aspect:visible-explanation-sufficiency; aspect:progressive-content-spatial-stability).'
