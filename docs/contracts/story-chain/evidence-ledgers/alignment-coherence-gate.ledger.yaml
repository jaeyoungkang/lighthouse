implementationContracts:
  - "Promise frontmatter supports `acRulesEnforced: true` to opt the entire Promise into the new AC slug rules. ACs in such Promises must declare `revision`. ACs in Promises without the flag are grandfathered."
  - "Sufficiency Review yaml block subset: single-line scalars only. Multi-line block scalars (`|`/`>`) and quoted scalars are rejected so the existing flat parser does not silently drop data."
  - Pre-cutoff (date < 2026-05-06) prose-only review entries are grandfathered. If a review entry carries a yaml block, the parser reads it regardless of date. Explicit yaml overrides are rejected; converted entries use the full review schema.
  - "`acReviewedRevision[]` parallels only the acceptance-check refs in `yaml.acs`; intent-check refs do not require a paired revision and the drift helper filters before indexing."
verdict: met
