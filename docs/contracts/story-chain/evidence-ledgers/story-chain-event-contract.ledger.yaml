implementationContracts:
  - "`docs/analytics/events.yaml` is the canonical event contract file."
  - "`npm run quality:fast` includes `npm run mc:validate-events`, and the event gate fails when event Story Chain refs are missing, malformed, stale, or cross-linked to the wrong Promise."
  - "`npm run quality:commit` also runs `npm run mc:validate-events`, because the runtime emitted-event scanner reads production source across `app/` rather than only staged contract files."
  - "`npm run quality:fast` and commit-time quality gates include `npm run mc:event-impact`. The command reports changed Promise surfaces, fails uncovered impacts that do not also update `events.yaml`, and keeps `docs/analytics/event-coverage.generated.md` synchronized through `npm run mc:event-impact -- --update`."
  - "`npm run mc:event-impact -- --sync` updates `events.yaml` directly: it adds `AUTO-DRAFT` canonical events for changed Promises without coverage, removes events whose `promiseRef` is not declared, updates each event's Moment ref from its Promise and Experience ref from that Moment, prunes stale Acceptance Check refs, and regenerates the coverage inventory. `mc:validate-events` rejects individually declared refs when those parent relations disagree."
  - The runtime router loads event definitions from `events.yaml`; call sites do not pass Story Chain refs or vendor event names. `mc:validate-events` also scans production `trackCanonicalEvent("...")` call sites and canonical server canonical mappings, so a runtime-emitted canonical event must be declared in `events.yaml` before the gate passes. Direct runtime calls must use literal canonical event names unless they are an intentional router/API method boundary. Unreachable legacy product events are retired from the active declaration and writer surface; historical local/vendor rows remain read-only and are not renamed or summed with current events.
  - Every canonical event declares an `emission` contract. `boundary` names the semantic emission point, `cardinality` says whether the event is every action, once per identity, once per session, or a state transition, `identityKeys` list the declared subject/property paths that make the logical event instance stable, and `emitter` names the implementation boundary responsible for firing it. For active product events, `mc:validate-events` resolves that emitter to exactly one exported production function, requires one direct declared-event emission and a production caller, and rejects direct bypass emissions. Render/update/effect re-execution is not an emission boundary by itself.
  - Every product event declares a `measurement` contract. `purpose` names the product question, `decisionUse` names how operators use the signal, and `propertyPurposes` names why each required/optional property is collected.
  - Active search-journey properties resolve through the shared `propertySchemas` contract. Each schema declares description, type, examples, sensitivity, context group, lifetime, source owner, and enum/range where applicable. Runtime routing rejects mismatches.
  - Accepted in-app search transitions create an opaque `search_context_id`. Requeries keep the journey root and link the preceding search through `parent_search_context_id`; same-tab citation and similar-paper routes retain the source search context. Direct URL and new-tab restores begin a local fallback context and do not impersonate an in-app submit.
  - Active search-journey events use `search_submitted`, `search_results_viewed`, `search_result_inspected`, `pdf_opened`, `citation_lineage_opened`, `similar_papers_opened`, `paper_saved`, and `paper_unsaved`. Canonical names and Amplitude sink names are identical snake_case values. Analytics subject and shared property schema keys also use snake_case. Their legacy `product.*` writers are retired without dual writes.
  - Compatibility `product.*` events may retain `fnv1a32:` query or term hashes only as approximate grouping keys inside the same event. The values are collision- and dictionary-prone and are not anonymity, user identity, a sensitive-data boundary, or a cross-event join key. Active search-journey events do not collect them; a future algorithm change requires a new event version or property and must not reinterpret historical rows.
  - Product Promises may declare `requiredEvents` in frontmatter. The validator treats a missing event name or an event pointing at another Promise as a contract failure.
  - Internal event storage receives only declared canonical properties; undeclared payload keys fail before store writes. External sink payloads are generated from the same event-specific allowlist. A local store write failure is reported as a store error but does not block external sink fan-out for events that are otherwise valid and externally allowed. The default local JSONL store writes to `.local/analytics-events.jsonl` in local development, uses `LOCAL_ANALYTICS_EVENT_STORE_PATH` when explicitly configured, and uses the OS temp directory in Vercel/serverless runtime so canonical event collection does not attempt to create `.local` under the deployment bundle. New local rows preserve canonical fields and add `localProvenance` with schema version, allowlisted environment/build revision, and `runtime | manual | test`; rows without it remain legacy/unknown and are not rewritten. Local provenance is not sent to Amplitude.
  - "External vendor fan-out is sink-driven: the router iterates the registered sinks (currently Amplitude HTTP V2), and each sink fires only when the event declares that vendor under `sinks.<vendor>` and `privacy.allowExternalSinks` is `true`."
  - Amplitude HTTP V2 delivery resolves its API key from the configured process environment and, for local server execution, loads `.env.local` before deciding the key is absent. Missing default configuration, network failures, and HTTP rejection failures surface as sink errors so route callers can keep returning 204 without losing the operational signal. Retryable delivery failures are retried with a stable `insert_id` so Amplitude can deduplicate the same event attempt.
  - External sink fan-out forwards a stable user_id (email for identified users) and the client-side `@amplitude/unified` device_id/session_id so anonymous and identified events resolve to a single vendor profile and Amplitude Session Replay can match events to the same device/session replay. Callers do not pass pseudonymous browser uuids as `actor.id`; anonymous events leave `actor.id` empty and the sink emits `device_id` and `session_id` when the SDK provides them.
verdict: met
