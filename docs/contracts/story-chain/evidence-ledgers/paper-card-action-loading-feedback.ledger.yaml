implementationContracts:
  - "`SearchResultItem` owns the visual loading affordance for paper-card actions."
  - Document renderers pass only the currently loading paper id for their local handlers.
  - Loading disables only the clicked action on the matching paper card.
  - "Pending card metadata for search and graph-neighbor views also stays inside `SearchResultItem`: unknown PDF availability appears as `PDF 확인 중`, and content/analysis preparation appears as the shared paper detail hydration frame below the action row."
  - The pending frame uses the same collapsed-card baseline and analysis region as metadata-only, not-started, error, and settled states. Loading feedback changes the state inside that region rather than the card rhythm.
verdict: met
