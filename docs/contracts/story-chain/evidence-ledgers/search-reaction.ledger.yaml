not terminal for hydration-owned facets. `app/server/domain-access/__tests__/search-enrichment-access.test.ts` (\"marks a successful empty pending hydration as terminal without rebuilding cards\"; \"marks a successful empty ready-snapshot repair as terminal\") verifies both successful-empty entry states preserve the committed lightweight cards and record their terminal attempt in canonical metadata. `app/components/research/__tests__/background-search-tasks.api-error-contract.test.ts` (\"does not retry a correctable 400 with the same search payload\") and `app/components/research/__tests__/ResearchBackgroundTasks.hydration.test.tsx` (\"retries search enrichment before leaving a pending result in place\") verify terminal HTTP meaning closes immediately while transient failures use the bounded three-attempt budget; either path preserves the lightweight result and settles `ready + repairAttempted:true`. The bootstrap-events test verifies that terminal marker closes AI comment waiting and prevents another repair from being queued."
