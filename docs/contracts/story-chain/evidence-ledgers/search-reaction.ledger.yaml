implementationContracts:
  - The listed Promise(s) are verified by the Acceptance Check entries and structured executions on this ledger.
  - Prompt context remains runtime-owned code, not markdown loaded from Story Chain. `app/lib/view-snapshot.ts` builds the bounded visible snapshot, and `app/domain/view-snapshot.ts` formats the prompt context that the structured generation route receives.
  - Reaction runtime fallback is not terrain evidence. Search route AI comment generation no longer runs through `respond` tool-calls; it uses structured JSON generation and returns `null` rather than a fallback success or failure comment when no valid title/body arrives.
  - Visible loading is not gated by provider generation start. The result ResearchRoutePayload marks pending AI comment state at result commit when a reaction is planned. Unfaceted searches generate from the committed snapshot without waiting for background card hydration; hydration-owned loaded-result facets keep that pending state through card detail enrichment and compatibility repair, then start one provider generation after their visible pool is stable.
  - "`aspect:library-grounded-research`: 라이브러리 신호가 있는 검색의 current route-view `viewSnapshot` prompt context에 어느 컬렉션의 관심사로 결과가 모였는지를 짚는 라이브러리 grounding 줄을 주입하고, 신호가 없으면 그 줄을 넣지 않아 반응은 기존 결과 지형 설명만 유지한다. 정렬·풀·근거 등 result-window 쪽 동작은 `library-grounded-research.ledger.yaml`에서 닫는다."
  - "`aspect:visible-explanation-sufficiency`: 판단에 필요한 current state와 limitation, fallback·근거 부족 신호는 접힌 화면에 남는다. 긴 generated body나 summary는 명시적 disclosure가 있는 bounded preview를 사용할 수 있다. 반복 논문 카드는 접힌 `요약`과 분석 상태를 유지하면서 정확한 생성 근거 라벨과 source/input scope 상세를 열린 inspection에 둘 수 있고, 초록 없음·pending·error 상태는 접힌 화면에서 숨기지 않는다."
verdict: met
