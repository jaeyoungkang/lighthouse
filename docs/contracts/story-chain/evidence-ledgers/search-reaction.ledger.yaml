  - key: promise:search-reaction-summarizes-terrain#acceptance-check:search-reaction-summarizes-terrain-generation-boundary
    assertion: vitest @ `app/components/research/__tests__/ResearchRouteRuntime.bootstrap.test.tsx` ("re-fires one route AI comment generation when a query transition clears the reaction and commits a new result"; "drops a queued route AI comment generation when a query transition advances the reaction generation before flush"; "fires route AI comment generation at commit for a first-reveal-locked personalized search"; "fires at commit for a personalized pending search without waiting for card hydration") + `app/components/research/__tests__/ResearchRouteRuntime.hydration-gating.test.tsx` ("keeps one generation when a lightweight search card hydrates after the comment settles"; "waits for a hydration-dependent search facet and generates once from the stable result set"; "rechecks hydration readiness when a queued command becomes gated before flush"; "reopens bootstrap when an active same-projection request becomes hydration-gated"; "resumes a settled-card regeneration after an active hydration gate closes"; "clears pending when hydration settles with an empty facet projection") + `app/components/research/__tests__/research-route-runtime.bootstrap-events.test.ts` ("waits for hydration when an active search facet depends on card details"; "waits for one-shot repair before generating from a ready faceted search"; "closes AI comment hydration waiting after a successful empty repair"; "keeps an unfaceted pending search on the first-commit generation path"; "skips empty search ResearchRoutePayloads when building generation commands") + `app/server/domain-access/__tests__/search-enrichment-access.test.ts` ("marks a successful empty pending hydration as terminal without rebuilding cards"; "marks a successful empty ready-snapshot repair as terminal"; "preserves the terminal repair marker when hydration returns no usable card details") + `app/components/research/__tests__/background-search-tasks.api-error-contract.test.ts` ("does not retry a correctable 400 with the same search payload") + `app/components/research/__tests__/ResearchBackgroundTasks.hydration.test.tsx` ("retries search enrichment before leaving a pending result in place"; "terminates abort-ignoring enrichment attempts and releases the runner") + `app/components/research/__tests__/ResearchRouteRuntime.reaction-generation-queue.test.tsx` ("drops an active result and regenerates from the current ViewSnapshot projection after the basis changes"; "does not re-fire an active regeneration for a metadata-only freshness change") + `app/lib/__tests__/view-snapshot.test.ts` ("keeps background-hydrated card details outside the search reaction basis"; "builds the search reaction snapshot from the loaded facet projection") + `app/server/services/__tests__/search-hydration.test.ts` ("hydrates the committed corpus ids and preserves provider total when no library blend applies"). 새 query request가 반응을 비우고 새 result commit을 만들면 새 쿼리 기준 route AI comment generation이 1회 발화된다. dedup 경계는 reaction generation과 prompt-relevant `ViewSnapshot` projection이다. 검색 paper projection은 첫 commit의 id/title/year/citationCount만 담고, 서버 hydration은 이 terrain을 보존한 채 abstract/authors/PDF/venue/field만 보강한다. Facet result pool을 바꾸지 않는 lightweight→hydrated 카드 전이는 settled comment와 generation 0을 유지하고 provider call을 반복하지 않는다. hydration-owned facet은 background detail enrichment와 one-shot compatibility repair가 모두 끝날 때까지 pending UI만 유지한 뒤 shared visible projection에서 한 번 생성하고, 모든 enqueue/system-event/flush/active-completion 경계가 background queue와 같은 repair predicate를 포함한 readiness builder와 abort signal을 재확인한다. 초기 pending hydration이나 ready-snapshot repair에서 usable detail이 비어 있는 성공 200은 committed lightweight 카드를 보존하고 즉시 canonical `ready + repairAttempted:true`를 남긴다. `429`·`5xx`·timeout·transport loss는 terminal marker 없이 최대 3회 bounded retry하고, correctable/auth/conflict 응답은 같은 payload를 반복하지 않는다. 어느 실패 경로든 lightweight 근거를 보존한 degraded settlement가 같은 terminal state로 gate를 닫는다. 기존 comment 재생성도 gate가 닫혔다 열리면 settled card와 generation을 보존한 채 terminal-ready command를 이어간다. terminal empty facet projection은 provider call을 만들지 않고 pending을 닫는다. projection이 바뀌면 이전 active 응답을 폐기하고 현재 projection에서 다시 생성하며, 큐에 남아 있던 오래된 command도 flush 시점에 버린다.
