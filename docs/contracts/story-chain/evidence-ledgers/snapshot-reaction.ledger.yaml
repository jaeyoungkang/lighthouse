implementationContracts:
  - The listed Promise(s) are verified by the Acceptance Check entries and structured executions on this ledger.
  - Route-view automatic comment prompts stay inside the current `viewSnapshot` / loaded result window / provider metadata / stored report body. Provider-limited empty lists and unknown availability are not prompt-level evidence of scholarly absence, and co-cited/coupled graph neighbors are not direct citation lineage.
