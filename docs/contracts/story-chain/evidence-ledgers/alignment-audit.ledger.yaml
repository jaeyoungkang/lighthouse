implementationContracts:
  - The alignment snapshot is a pure deterministic function of the shared Story Chain graph (`docs/contracts/story-chain/promises/`, `aspects/`, and strict `evidence-ledgers/*.ledger.yaml` v2 entries and executions); no LLM or live judge is involved.
  - Contract update history is derived from local git metadata for Story Chain Markdown and `*.ledger.yaml` files; working tree changes are classified by deterministic audit findings and CLI gates.
  - Aspect rows are emitted as a separate collection from Promise rows, each carrying id / appliesTo / coveringLedger / verdict for Mission Control CLI calculation.
  - "`mc:check-critical-findings` partitions the current alignment snapshot into critical and warning findings, and exits non-zero on any current critical."
  - The release verdict consumes 4 dimensions (Intent verdict / AC trace / Service Policy Coverage / Aspect) and reports three clusters (종단축 = Intent + AC trace; 구성 전 서비스 정책; 횡단축 = Aspect) through `mc:status`.
  - "Promise ↔ Evidence Ledger trace is bidirectional: a missing YAML v2 `acceptanceChecks` entry emits `missing_ac_ledger`, while an unknown Promise or Acceptance Check key fails strict Story Chain validation. Foundational Markdown is outside the executable ledger graph."
  - High-level concept duplication is surfaced as `duplicate_high_level_concept` warning findings for exact normalized Experience/Moment label collisions; adjustment remains a Mission Control merge/split/rename/remove decision, not an automatic rewrite.
verdict: met
