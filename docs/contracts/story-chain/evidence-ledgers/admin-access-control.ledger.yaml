implementationContracts:
  - Rendered admin routes call the internal admin auth boundary, and every invited-access Server Action repeats that authorization.
  - The admin boundary is `@corca.ai`; external product allowlist entries do not become administrators.
  - "`lighthouse.access_allowlist_entries` is the only external allowlist source: row presence grants access and row absence denies it."
  - Admin list reads use a fixed-size email-ordered keyset page while URL navigation carries only the row's opaque cursor id, never the invited email.
  - The dedicated PostgreSQL integration lane executes `app/server/repository/__tests__/access-allowlist.postgres.integration.ts` through `npm run test:db:gap-report-concurrency` to prove first/next/previous/last ordering and concurrent insert/delete boundaries against the real schema and PostgREST query semantics.
  - Existing environment entries are migrated before rollout and are not read by the runtime access policy.
  - A committed add/remove emits the internal operator id and operation through the canonical Amplitude mapping; the invited email is never event payload.
  - "`/admin/access` and `/admin/analytics` are the retained admin pages. Process-governance verdicts are read through Mission Control CLI and do not create web access boundaries."
verdict: met
