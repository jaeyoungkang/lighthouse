implementationContracts:
  - 새 검색 결과 배열은 keyword provider 결과 최대 40편과 graph 결과 최대 40편을 함께 담고 `libraryOnlyPaperIds`로 출처를 구분한다. paper-id/title-family 중복 전 최대 80편이며 저장된 과거 snapshot은 기존 reader의 호환 범위를 유지한다.
  - reviewed_papers source는 owner principal로 제한한 뒤 `reviewed_at DESC, id DESC`로 결정적으로 읽는다. Unit evidence가 repository query shape를 고정하고 `app/server/repository/__tests__/reviewed-papers.postgres.integration.ts`는 같은 timestamp tie와 matching composite index를 production repository 경계에서 검증한다. 이 실제 DB profile은 `.github/workflows/quality.yml`의 `db-integration` job이 current migration을 적용한 뒤 `npm run test:db:gap-report-concurrency`로 실행한다. 범용 Evidence Ledger runner는 로컬 서비스 bootstrap을 소유하지 않으므로 structured execution으로 중복 등록하지 않는다.
  - reviewed_papers source가 정해지면 query-aware PaperNeighborhood preflight가 현재 anchor를 읽고 graph candidate와 관계 점수를 첫 payload 안에서 확정한다. 검색 응답 뒤 citation provider warm이나 process cache fill을 시작하지 않는다.
  - "`interestWeights`는 query-aware graph 근거가 양수인 paperId만 담고, keyword 포함 여부와 관계없이 해당 카드에 `내 연구와 가까움` marker를 하나 붙인다. keyword-only, 0 이하 weight, DOI exact lookup에는 marker를 붙이지 않는다. 정렬 전용 `combinedRankWeights`는 keyword provider 최종 순위와 Episteme 3 `fusion_score`를 매핑한 라이브러리 근접도를 각각 환산해 같은 최대 기여도로 더한다. 정확한 정규화와 relation 내부 비중은 `docs/runtime-flows/search-retrieval-ranking.md`가 단독 소유한다. 같은 논문은 두 축의 점수를 모두 받고, 고정 위치를 배급하지 않는다."
  - PaperNeighborhood 상위 40편을 hydrate한 뒤 keyword 중복과 연도 범위를 제거하고 남은 후보 전부를 같은 결과 pool에 합류시킨다.
  - 첫 payload의 현재 writer는 `applied / no_signal / unavailable`을 기록한다. `not_requested`는 과거 snapshot 호환 상태로만 읽는다. `unavailable`만 결과 header의 안내를 만들고, raw provider·HTTP·circuit 원인은 client payload가 아니라 gateway와 search timing telemetry가 소유한다.
  - 사용자가 선택하는 basis projection과 preference store는 없다. 기존 `personalize=false` 입력은 검증 뒤 현재 단일 결과로 정규화하고 신규 writer와 canonical search identity는 이 값을 만들거나 사용하지 않는다.
  - 합류 후보는 결과 수·더보기·facet·후속 입력에 참여한다. `rankingMode:combined_score`가 active reader를 legacy interleave reader와 구분한다.
  - Tier 2 shared references/citers와 hydration 이후 rerank는 커버리지 측정 전까지 열지 않는다.
verdict: met
