implementationContracts:
  - "Automatic route AI comment generation does not use `respond` or a tool-call fallback. It performs one structured generation call; invalid, empty, provider-failed, aborted, or timed-out output returns `reaction: null`, clears pending UI state, and surfaces the null result to the current route view."
  - When a deterministic product surface renders degraded failure copy instead of nullable generation output, that copy is short Korean plain text and includes no raw provider error, API key, stack trace, HTTP status, exception class, or follow-up surface.
  - Deterministic research surfaces remain usable; degraded AI output does not claim to summarize or interpret content that the provider failed to generate.
  - Degraded AI comment notices are not persisted route AI comment state. New write boundaries reject or strip those notices, migration `supabase/migrations/00008_drop_degraded_document_reactions.sql` removes older stored rows, and repository hydration filters any older stored degraded notices that remain.
  - Automatic route AI comment provider failures log best-effort `api_error` metadata but return nullable reaction output to the route caller.
  - A provider-failed gap enrichment keeps the persisted core graph usable. Only the explicit authenticated retry command reopens enrichment; retry progress does not hide the core, and another failure returns to the same degraded surface without a fabricated narrative or automatic revisit retry.
verdict: met
