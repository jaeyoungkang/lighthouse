implementationContracts:
  - The route AI comment pending shell and settled preview use `data-generated-content-region="route-ai-comment"` and the shared bounded-region class.
  - Repeated paper-card hydration, analysis progress, error, evidence limit, and settled summary use `data-generated-content-region="paper-card-analysis"` below the action row.
  - Repeated cards use one responsive collapsed-card minimum-height class. The value remains a design value rather than an Acceptance Check threshold.
  - Automatic generated prose uses a bounded preview. Only the owning disclosure removes the preview limit.
  - The paper-card owning disclosure is the card's non-interactive region plus an icon-only accessible button; nested links and controls never trigger it.
  - 카드 disclosure 상태는 현재 route document identity에만 속한다. 같은 document의 hydration은 상태를 유지하지만 인용 관계·비슷한 논문 document id가 바뀌면 새 카드가 접힌 상태로 시작한다.
  - Generated body text is not included in the AI comment expansion analytics payload.
verdict: met
