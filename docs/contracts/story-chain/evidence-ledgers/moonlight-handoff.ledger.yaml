implementationContracts:
  - Result-card PDF affordances hand off to Moonlight. The title remains identification text, while the card's non-interactive region owns inspection.
  - PDF link activation is isolated from the card disclosure state.
  - The encoded URL source is the direct PDF URL. Raw URLs do not enter analytics payloads.
  - "`pdf_opened` is the only active product handoff event. It reuses the paper-card journey/search context and does not dual-write the retired `product.pdf_open.clicked` event."
  - The handoff is an external link that preserves the Light House research route.
  - Missing or unresolved PDF availability keeps the existing disabled/checking states rather than rendering a broken external link.
verdict: met
