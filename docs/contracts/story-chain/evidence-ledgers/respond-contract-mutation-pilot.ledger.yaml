implementationContracts:
  - "`stryker.config.mjs` / `stryker.agent.config.mjs` — agent runtime contract slice scope is `app/server/agent/route-ai-comment-generation.ts`, `app/server/ai-generation/gateway.ts`, `app/components/research/route-ai-comment-generation-client.ts`, and `app/components/research/route-ai-comment-generation-scheduler.ts`."
  - "`stryker.contracts.config.mjs`, `stryker.domain.config.mjs`, `stryker.research-route.config.mjs` — extend the same manual mutation lane to analytics event contract code, domain access, and research route payload store invariants. Each slice uses the vitest runner with `perTest` coverage, ignores static mutants through the shared base config where applicable, writes HTML + JSON reporters to `reports/mutation/<slice>/`, and carries a `thresholds.break` gate."
  - "`vitest.config.mutation.mts` — extends the main vitest config and adds `**/*.live.test.*` to `test.exclude` so route-view generation mutants do not trigger real provider calls."
  - "`package.json` — `mutation`, `mutation:*`, `mutation:all` scripts and Stryker devDependencies are pinned."
  - "`.github/workflows/mutation.yml` — the only trigger is `workflow_dispatch`; `schedule`, PR, and push triggers are absent. It runs the 4 mutation slices through a GitHub Actions matrix (`agent / contracts / domain / research route payload`) with `fail-fast: false` and a per-slice `timeout-minutes` cap, and uploads one `mutation-report-<slice>` artifact per slice. PR gate (`quality.yml`) does not call `npm run mutation`."
  - "`docs/contracts/story-chain/evidence-ledgers/respond-contract.ledger.yaml` — carries the mutation-pilot contract evidence referenced by this ledger."
  - "`docs/contracts/story-chain/hardening-tier-policy.md` §2 — names this ledger as the current pilot owner and retains the historical baseline as evidence rather than active policy authority."
