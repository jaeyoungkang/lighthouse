implementationContracts:
  - The runtime computes the deterministic gap-network core (clusters, concept edges, gap pairs, metrics) before LLM narrative enrichment and persists that core on the `gap_network` ResearchRoutePayload metadata with `gapNetworkBuild.core = "ready"`.
  - Gap Network presentation canonicalizes force nodes by concept id and force links by cluster, source, target, and weight before simulation. Equal two-cluster labels use cluster id as the anchor tie-breaker, so array permutation alone cannot change cluster anchors or concept coordinates.
  - The core build records `gapNetworkBuild.coreEvidence = "citation-semantic-graph-v2"` when citation, semantic, and graph-support relationship evidence has been included. An enrichment-pending no-gap ResearchRoutePayload without that v2 marker is stale and must not be used for digest-based ready artifact reuse, status completion, route AI comment generation, or viewed analytics. Direct `/gap/:id` rendering remains observer-only and shows pending progress rather than terminal no-gap UI for stale no-gap ResearchRoutePayloads.
  - 'A `gap_network` ResearchRoutePayload is not considered ready for existing-artifact reuse, completed open event, route AI comment generation command, or viewed analytics unless it is display-ready: the core report has settled and either the report is a terminal empty-state (`totalEdgeCount = 0` or no meaningful `gapPairs`) or `gapNetworkBuild.enrichment` is terminal (`"ready"` or `"failed"`). Blank report metadata with empty input/metrics is rebuilt or remains pending and must not be rendered as terminal insufficient evidence.'
  - "Pending progress covers the whole normal creation wait: input/paper preparation, relation calculation, cluster/gap candidate calculation, persistence, and applying LLM interpretation to the same route payload. Relationship/gap-bearing core ResearchRoutePayloads keep the loading screen until enrichment reaches a terminal marker."
  - "The independent runner owns execution after POST from the persisted share-safe snapshot: deterministic core build, persist, and stored-core enrichment. It consumes graph support only when the source snapshot already carries it and never opens a provider graph phase. Active attempts start at `core-build`; historical `graph-support` phase values remain read-compatible. The runner records `phase`, `attempt`, `leaseExpiresAt`, and phase durations on `metadata.gapNetworkBuild`; status polling and `/gap/:id` are read-only observers and must not start provider, LLM, or core calculations."
  - Status polling은 active execution과 view id 수명에 묶이고, 인증된 현재 가입자의 shared artifact를 id로 관찰한다. Missing artifact, stored build-failed marker, failed status payload는 terminal failure로 닫고 provider·LLM·core 계산을 시작하지 않는다.
  - 'LLM narrative enrichment is a same-ResearchRoutePayload upgrade that reuses the stored core payload: `gapNetworkBuild.enrichment` starts as `"pending"` on the core ResearchRoutePayload, becomes `"ready"` after domain label, cluster/gap prose, content narrative, and enriched prepared reactions are written back to the same route payload id/version stream, or becomes `"failed"` when the enrichment attempt is terminally degraded.'
  - Terminal empty-state reports are not enrichment targets. Once the core report has settled with `totalEdgeCount = 0` or no meaningful `gapPairs`, the UI renders the terminal empty-state report without `해석 보강 중`, without lower content enrichment status, and without starting runner enrichment.
  - The lower content report is gated by actual prose, not just by edge count. Enrichment-pending relationship/gap-bearing core ResearchRoutePayloads do not render the vertical stack yet; enrichment-failed ResearchRoutePayloads may render the graph but must show a degraded content state instead of empty `분석된 분야` / `클러스터 배경과 차이` sections.
  - A failed enrichment is reopened only by the authenticated dedicated retry command. It uses report id plus artifact version CAS to move the same settled core from enrichment failed to pending, while the existing runner acquires a fresh attempt and lease. The first explicit retry is immediate; after a user-started retry fails, the same report has a 60-second cooldown derived from its persisted failed timestamp and retry count. Retry-pending UI keeps the core graph visible. Status reads and revisits do not reopen a terminal enrichment failure; the general gap POST preserves its pre-existing failed-core recovery only and does not reopen failed enrichment. Accepted pending work may still use the existing expired-lease recovery path.
  - Overlay clicks never run analysis or enrichment. They only read the current `metadata.reactionPreparation` snapshot from the owning `gap_network` document after enrichment is ready. While enrichment is pending the route remains on loading; while enrichment is failed, graph selection can focus/zoom but does not show deterministic fallback text as a click explanation.
  - Prepared overview/cluster/gap 선택은 active execution을 optimistic하게 갱신한다. Reaction route는 현재 가입자의 `(gap_report_id, viewer_principal_id)` preference를 reactionVersion CAS로 갱신하고 artifact version을 함께 고정한다. Bounded retry/read-back은 현재 viewer preference만 화해한다.
  - The cluster reaction body stays within `aspect:visible-explanation-sufficiency` §3.2 limits (aspect:visible-explanation-sufficiency body cap of 200 chars on the cluster overlay surface; 400 chars on full AI-comment surfaces).
  - Cluster and gap clicks dispatch to the owning AI reaction layer through forwarded callbacks. Gap nodes/links stay visible, are clickable, and drive the side-panel gap explanation card without re-running gap analysis.
  - Overlay and AI reaction surfaces never re-run gap analysis; the runtime delivers the prepared payloads through the ResearchRoutePayload metadata channel.
  - Citation-lineage follow-up analysis reuses the same `gap_network` runtime. It passes the union of 선행 연구(references) and 후속 연구(citations) from the lineage ResearchRoutePayload as the source set so the visible reference/citation papers and the gap-analysis input stay in sync. References are listed first, then citations; if one direction is empty, only the populated direction is used.
  - Graph-neighbor follow-up analysis also reuses the same `gap_network` runtime. The source id remains provenance only. The build reads graph candidate papers and co-cited/coupled shared-count evidence from the persisted share-safe snapshot, not from the source ResearchRoutePayload.
  - Search, citation-lineage, and graph-neighbor follow-up actions cross one bounded gap snapshot adapter. It keeps at most 40 unique papers, preserves citation/graph equality with compact local ids, removes output-inert author/PDF/DOI metadata, and truncates text at complete UTF-8 boundaries before enforcing the shared 1,000,000-byte serialized request ceiling. The route independently enforces the same byte ceiling and untrusted scalar/fan-out limits; schema preflight rejects unknown fields against the version+basis-specific graph-support root and the per-paper score, v2 candidate-count, and filtered-count objects before union diagnostics. Invalid 400 responses expose field paths and messages without echoing input values. Regression evidence is `app/lib/__tests__/gap-report-input-budget.test.ts`, `app/lib/__tests__/graph-paper-snapshots.test.ts`, `app/components/research-route-renderers/__tests__/search-view-agent-actions.test.ts`, `app/server/lib/__tests__/bounded-json-body.test.ts`, `app/api/gap-reports/__tests__/route.test.ts`, `app/api/gap-reports/__tests__/route-graph-support-variant.test.ts`, and `app/api/gap-reports/__tests__/route.source-paper-ids.test.ts`.
  - Gap enrichment projects query, cluster, concept, representative-title, and abstract fields through one UTF-8 prompt budget before calling the shared structured-generation gateway. Every gap interpreter passes a 65,536-byte exact prompt ceiling and a response-shape-specific output token cap; the gateway rejects overflow before Gemini/OpenAI dispatch, and the interpreter's existing fallback keeps the deterministic core usable. `GAP_NETWORK_CLUSTER_LIMIT` and `GAP_NETWORK_GAP_PAIR_LIMIT` are shared by deterministic core production, enrichment consumers, and `app/server/services/knowledge-map/__tests__/gap-network-prompt-budget.test.ts`, so that test exercises the actual maximum five-cluster/ten-gap/forty-paper multibyte envelope. `app/server/ai-generation/__tests__/gateway.test.ts` is the overflow negative guard and `app/server/ai-generation/__tests__/judgment.test.ts` locks fallback propagation.
  - 'Gap-network page/POST/status routes require the current authenticated member and do not accept `ownerPrincipalId` in client payloads. The browser-window entrypoint is `/gap/:id` after snapshot POST returns a gap report id; POST creates the persisted shared artifact in `lighthouse.gap_reports`, status/page routes observe it, and the domain boundary projects it as `ResearchRoutePayload(type: "gap_network", viewerPrincipalId)` with no owner alias. The versioned source-input digest scopes persisted artifacts and in-flight dedupe; the current principal scopes only runtime projection and viewer reaction preference. Type discrimination, strict schema parsing, repository mapping, renderer use, and store patch rejection make alias return a test failure.'
  - "For `aspect:search-first-url-model`, this ledger covers the saved-artifact side of the model: search/citation/similar routes stay condition-addressed, while the completed gap report is an id-addressed `/gap/:id` artifact backed by `gap_reports`."
verdict: met
