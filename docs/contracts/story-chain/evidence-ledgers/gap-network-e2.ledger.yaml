  - key: promise:gap-network-detection-from-search#acceptance-check:gap-network-detection-from-search-progress-staged-pacing
    assertion: vitest @ `app/components/research-route-renderers/__tests__/gap-network-view.helpers.test.ts` ("advances one visible progress stage per min-dwell and holds on interpret") + `app/components/research-route-renderers/__tests__/GapNetworkView.progress-pacing.test.tsx` ("holds a fast empty-state build briefly, then reveals it before the meaningful-gap floor"; "reveals a reopened already-ready report immediately without the minimum-visible hold"; "starts a report opened mid-enrichment on the interpretation stage instead of replaying early stages"; "freezes the progress bar for a terminal-failed build instead of animating toward completion"). gap report 생성 진행 표시는 관찰 가능한 build phase가 coarse하고 deterministic core가 짧은 시간에 정착하므로 화면 단계 전환을 raw phase에 묶지 않고, client가 소유한 min-dwell 애니메이션으로 수집→보강→군집→분석→해석 단계를 순차 노출한다. 진행 stage 선택은 `GAP_NETWORK_PROGRESS_STAGE_DWELL_MS` 간격으로 한 단계씩 전진하고 마지막 pending 단계(해석)에서 멈춘다. 새로 생성 중이던 report는 core/enrichment가 빨리 끝나 display-ready가 되어도 `GAP_NETWORK_MIN_VISIBLE_PROGRESS_MS` 전에는 그래프 리포트로 전환하지 않고 진행 애니메이션 화면을 유지하므로, 빠른 완료나 관계 근거 부족 terminal empty-state 생성도 첫 단계만 반짝 뜨고 completed로 점프하지 않는다. terminal empty-state는 그래프가 아니라 짧은 근거 부족 안내라 `GAP_NETWORK_MIN_VISIBLE_EMPTY_PROGRESS_MS`(의미 있는 공백 리포트의 floor보다 짧음)로 먼저 공개한다. 이미 display-ready인 report를 다시 여는 재오픈 경로는 이 최소 노출 지연 없이 즉시 리포트를 보여준다
