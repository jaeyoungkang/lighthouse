n while Greek scientific tokens remain valid, expanded paper inspection shows the paper-specific limitations summary (omitted when null, never a generic disclaimer) and at most three query actions each with its one-line rationale, without a nested disclosure or candidate cards, search/citation/graph-neighbor surface parity holds, plain clicks route in the current window, detached clicks open the same query-only route without mutating the current route, legacy selected library ids, retired personalize state, and source paper/position/axis provenance stay out of the destination URL, metadata, and canonical search identity, and analytics omits raw query text.
