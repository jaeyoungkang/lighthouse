  - key: promise:inline-analysis-auto-run#acceptance-check:inline-analysis-auto-run-visible-first-priority
    assertion: vitest @ `app/components/research-route-renderers/__tests__/SearchView.visible-window.test.tsx` ("queues search inline analysis only after rendered cards enter the viewport"; "does not carry exposed paper ids into a new inline-analysis cycle"; "keeps card exposure when hydration adds analysis input to the same paper id") + `app/components/research-route-renderers/__tests__/CitationLineageView.graph-neighbors.test.tsx` ("queues inline analysis for graph-neighbor document cards inside the first visible budget") + `app/components/research-route-renderers/__tests__/GraphNeighborsView.inline-analysis-terms.test.tsx` ("queues inline analysis for visible graph-neighbor axes") + `app/components/research-route-renderers/__tests__/CitationLineageView.inline-analysis-budget.test.tsx` ("queues inline analysis for citation-lineage cards inside the first visible budget"; "queues inline analysis for visible reference and citation sections") + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-order.test.tsx` ("starts route AI comment generation before inline analysis batches") + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-window.test.tsx` ("runs inline analysis only for task visible paper ids"; "runs inline analysis for rendered expanded-window cards without queueing hidden cards"; "keeps expanded relationship visible ids queued after the first running batch completes") + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-continuation.test.tsx` ("continues queued relationship visible ids through the mounted runner after controller cleanup"; "hands corrected paper input to the next batch without inheriting stale recovery"; "starts the replacement cycle after the previous controller settles") + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-canonical.test.tsx` ("requeues an inline-analysis batch when an abort-ignoring request times out"; "requeues a current inline batch when a same-execution unmount aborts transport") + `app/lib/__tests__/fetch-with-silence-timeout.test.ts` ("settles at the deadline even when the transport ignores abort"; "settles a body read when the upstream reader ignores abort"; "discards a non-success response body when the caller will only inspect status") + `app/stores/__tests__/background-task-store.inline-analysis.test.ts` ("guards inline-analysis task state updates by cycle key") + `app/server/domain-access/__tests__/inline-analysis-access.test.ts` ("completes one slow provider wave without starting papers six through ten"). 현재 노출된 논문 카드 window부터 우선 분석하고, 검색 결과·인용 관계·비슷한 논문 모두 현재 visible result window 밖의 후보를 자동 큐잉하지 않는다. 새 result-set cycle은 이전 cycle에서 노출된 paper id를 이어받지 않는다. 관계형 ResearchRoutePayload는 섹션/축별 10개가 합산되어 처음부터 20개가 보일 수 있지만, provider batch는 5개씩 한 wave만 실행하고 첫 batch가 끝난 뒤 나머지 visible id가 task에 남아 다음 batch로 이어진다. 사용자가 `더보기`로 window를 확장해 새 카드가 보이면 그 보이는 카드 id도 분석 대상이 된다. 같은 paper id에 hydration이 초록을 채워도 기존 viewport exposure를 보존한다. Active controller의 이전 입력이 실패해도 stale recovery clock을 새 입력에 넘기지 않고 corrected batch를 이어 실행하며, enrichment가 result-set cycle을 교체한 경우에도 controller 정리 뒤 최신 queued cycle을 깨운다. 공통 65초 silence rail은 abort 무시 transport를 끝낸다. 첫 timeout은 같은 execution·cycle의 running batch를 queued로 돌리고 retry count를 올리며, 반복 missing·timeout은 기존 bounded retry 상한에서 error로 닫는다. 소비하지 않는 non-2xx body는 즉시 cancel한다. 같은 execution의 renderer unmount abort는 current cycle의 running batch만 queued로 되돌린다.
