  - key: promise:inline-analysis-auto-run#acceptance-check:inline-analysis-auto-run-db-cache-shown-immediately
    assertion: vitest @ `app/server/domain-access/__tests__/inline-analysis-access.test.ts` ("hydrates search metadata with current shared cached analyses by paperId"; "reuses shared cached results and only claims and analyzes missing papers") + `app/components/research-route-renderers/__tests__/search-view.helpers.test.ts` ("builds inline analysis and reviewed lookup structures"; "ignores stale inline analysis cache versions"). 검색 결과·인용 관계·비슷한 논문 카드에서 현재 버전 DB 캐시가 있으면 card metadata에 즉시 재사용하고, stale cache는 표시하지 않는다.
