  - The listed Promise(s) are verified by the Acceptance Check entries and structured executions on this ledger.
  - Exact cache identity continues through the API and card cache; server hydration, background merge, and late persistence reject a same-version analysis when its canonical paper input changed or its legacy fingerprint is absent.
  - 카드 표시뿐 아니라 비슷한 논문 query, 검색어 추출 prompt와 method support, 관계 route 연구 용어, knowledge-map external signal도 같은 current-version·fingerprint-present·usable-abstract predicate를 사용한다. 초록이 없거나 공백뿐인 snapshot에 남은 embedded analysis는 hydration 경계에서 제거해 파생 소비자가 오래된 의미를 다시 읽지 못하게 한다.
  - The shared-cache migration permits one 30-second automatic claim only for a new identity. An expired pending identity requires the explicit retry command, and an active lease cannot be mutated; completion, failure, and release remain token-matched transitions.
  - The timing suite proves waiter read failure and missing peer rows reject after the observation budget, a delayed claim cannot return an unsafe successful partial response, and a route-entry absolute deadline aborts a stalled cache RPC. Cleanup and repository tests prove that zero-row, one-of-two partial, or mismatched-tuple release confirmation is non-success and runtime signals reach cache RPC transports.
  - The process coalescing suite proves one subscriber can abort without cancelling another, while the last subscriber abort still releases an owned lease through an independent cleanup signal whose 1.5-second abort is tested.
  - The canonical client timeout case settles the paper/task as `error`/`settled` without an automatic second request.
  - The explicit-recovery suite proves provider failure settles without an automatic retry and sends a new request only after the user invokes the explicit retry command.
  - The collapsed repeated-card frame keeps `요약`, analysis state, missing-abstract limitation, pending, and error signals visible. It defers only the exact abstract-source badge and source/input-scope links to the opened inspection, where the full triage detail appears in place.
