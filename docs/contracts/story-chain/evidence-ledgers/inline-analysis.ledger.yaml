  - key: promise:inline-analysis-auto-run#acceptance-check:inline-analysis-auto-run-shared-cache-reuse
    assertion: vitest @ `app/server/domain-access/__tests__/inline-analysis-access.test.ts` ("hydrates search metadata with current shared cached analyses by paperId"; "reuses shared cached results and only claims and analyzes missing papers"; "waits for another worker's shared result instead of generating a duplicate"; "keeps a coalesced generation alive when one authenticated subscriber aborts"; "waits in parallel after one shared claim attempt"; "preserves a completed row and terminal-fences an omitted claimed result"; "generates each globally shared paper from only its own canonical prompt input"; "keeps one request to a single five-paper provider wave"; "completes one slow provider wave without starting papers six through ten"; "uses different shared identities when the same paper id carries different content"; "includes year in the shared identity but normalizes prompt whitespace") + `app/server/domain-access/__tests__/inline-analysis-hydration.test.ts` ("replaces a same-version embedded analysis when its paper input fingerprint changed"; "removes a mismatched embedded analysis when the exact shared cache is missing") + `app/server/domain-access/__tests__/inline-analysis-access-cleanup.test.ts` ("releases an owned lease with an independent signal after the last subscriber aborts"; "aborts a hanging independent cleanup after 1.5 seconds"; "terminal-fences an omitted claimed identity instead of releasing it"; "terminal-fences every omitted identity without partial release"; "handles an earlier peer rejection while owner generation is still settling") + `app/server/domain-access/__tests__/inline-analysis-access-timing.test.ts` ("does not coalesce structurally different identities containing delimiters"; "rejects after the peer observation budget when the waiter fails"; "aborts and settles the peer waiter when owned completion fails"; "waits for a peer cache result within the thirty-second lease"; "uses elapsed wall time instead of sleep totals to bound slow cache polling"; "waits through the peer lease instead of returning a partial successful response"; "fails instead of returning partial when a delayed claim pushes peer observation past the route deadline"; "fences the owner deadline instead of releasing it for automatic retry") + `app/server/repository/__tests__/paper-inline-analysis-cache.test.ts` ("reads ready rows by paper input identity without a principal predicate"; "does not reuse a ready row when the paper content fingerprint differs"; "keeps exact requested identities when an RPC response contains cross-product rows"; "claims and completes a paper-input lease without accepting a principal key"; "releases only the token-matched pending identities through the shared RPC"; "does not confirm release for a mismatched returned identity"; "pins shared identity and token-matched claim, complete, and release transitions") + `app/components/research-route-renderers/__tests__/SearchView.visible-window.test.tsx` ("keeps card exposure when hydration adds analysis input to the same paper id") + `app/components/research-route-renderers/__tests__/search-view.inline-analysis-cycle.test.ts` ("keeps cycle identity fields structurally separated") + `app/components/research-route-renderers/__tests__/search-view.helpers.test.ts` ("does not merge late inline analysis after hydration changes its prompt input") + `app/components/research-route-renderers/__tests__/search-view.inline-analysis-identity.test.ts` ("ignores same-version inline analysis snapshots without their input fingerprint") + `app/components/research/__tests__/ResearchBackgroundTasks.hydration.test.tsx` ("replaces current inline analysis when hydration changes only its title input"; "replaces current inline analysis when hydration changes only its abstract input"; "replaces current inline analysis when hydration changes only its year input"; "uses the incoming exact cache when the same paper input has a different fingerprint") + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-merge.test.ts` ("keeps the current exact cache when stale hydration has no fingerprint"; "keeps an authoritative exact-cache miss from restoring the base stale analysis") + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-continuation.test.tsx` ("hands corrected paper input to the next batch without inheriting stale recovery"; "starts the replacement cycle after the previous controller settles") + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-canonical.test.tsx` ("ignores an in-flight result when the same paper id receives new prompt input"; "resets settled-error retry state when paper input changes") + `app/server/services/__tests__/inline-analysis-service.test.ts` ("propagates the owner deadline signal into structured generation") + `app/api/papers/analyze-inline/__tests__/route.test.ts` (authentication-first request, shared 5-paper cap, field cap, body cap) + `app/components/research/__tests__/ResearchBackgroundTasks.inline-analysis-owner-recovery.test.tsx` ("sends a second request only after the explicit retry command"; explicit cooldown settlement and user-command retry) + `scripts/architecture-fitness/__tests__/least-authority-boundaries.test.ts` (exact repository value-export surface, computed RPC resource ownership, unrelated RPC allowance, and direct shared-table access rejection). 공동 cache 조회·process in-flight·DB claim identity에서 principal을 제거하고 `(paper_id, version, canonical normalized title/abstract/year fingerprint)`을 사용한다. 각 shared artifact는 해당 논문 한 편만 담은 canonical prompt에서 생성하며 한 요청은 provider 동시 실행 5개의 한 wave만 처리한다. exact-tuple 조회와 mutation RPC 응답이 요청 identity의 교차곱 또는 다른 fingerprint row를 수용하지 않고, shared table은 security-definer RPC 밖의 직접 DML 권한을 주지 않는다. Fingerprint는 API 결과와 카드 cache까지 유지한다. 서버 hydration은 현재 paper 입력으로 이를 재계산하고, client merge·late persist·in-flight response와 retry-state input comparison은 title·abstract·year가 바뀌면 이전 분석과 실패 횟수를 버리며 fingerprint 없는 legacy card cache도 current로 표시하지 않는다. 같은 입력을 보존하는 hydration에서도 incoming fingerprint가 다르면 서버가 보낸 exact cache를 우선한다. Viewport exposure cycle은 구조화한 document·query/seed·paper id 결과 집합에만 귀속되어 delimiter가 포함돼도 서로 다른 구성요소가 충돌하지 않고, same-id hydration에서도 노출을 보존한다. Prompt-input 변화는 해당 paper의 progress/retry만 초기화하며, 이전 controller의 stale 5xx는 corrected input에 recovery clock을 넘기지 않는다. Result-set cycle이 바뀐 경우에도 controller 정리 뒤 최신 queued cycle을 깨운다. 30초 automatic claim은 새 row만 획득하고, 만료된 pending row는 explicit retry command로만 회수하며 active lease를 갱신하지 않는다. 24초 owner-work signal과 token-matched complete/release가 cross-process 중복 생성 및 route 초과를 막는다. 타 worker waiter는 생성과 병렬로 시작해 claim 응답부터 30초 동안 peer 결과를 관찰한다. waiter read 실패나 미확인 peer ready row는 성공 partial로 낮추지 않고, delayed claim 때문에 route-entry 30초 안에서 관찰을 끝낼 수 없는 경우와 함께 5xx로 닫는다. owner 실패는 waiter를 취소·정착시킨다. 같은 process의 caller는 subscriber별로 취소되어 한 caller의 abort가 남은 공유 생성을 끊지 않고, 마지막 caller abort 뒤 release는 독립된 최대 1.5초 cleanup signal을 쓴다. 완료되지 않은 claim만 release하고 RPC가 모든 요청 identity의 exact token release를 확인해야 성공으로 인정한다. 오류·0건·부분 확인은 즉시 5xx로 닫으므로 ready 결과를 덮지 않는다. Provider omission과 owner deadline은 durable failure fence로 전환하고 explicit user retry 전에는 provider를 다시 호출하지 않는다. API는 인증 뒤 최대 5편과 bounded body/field만 받으며, repository export는 단일 domain-access owner만 획득하고, 네 shared RPC resource는 computed member access와 destructuring lexical shadow까지 cache repository owner로 제한하되 정적으로 이름 붙은 무관 RPC는 막지 않는다. 실제 생성 usage는 최초 lease owner principal에게만 기록하고 cache hit·waiter에는 기록하지 않으며 failure placeholder는 ready cache가 되지 않는다.
