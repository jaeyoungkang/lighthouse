    assertion: vitest @ `app/components/research/__tests__/research-route-shell.test.tsx` + `app/components/research/__tests__/ResearchRouteSearchBar.test.tsx` + `app/components/research/__tests__/ResearchRouteLayout.view-mode.test.tsx` + `app/components/research-route-renderers/__tests__/search-view-content.test.tsx` + `app/components/research-route-renderers/__tests__/search-view-content.result-basis.test.tsx` — authenticated shell은 route-level 검색 entry를 제공하고, 빈 `/search`는 중앙 시작 화면의 단일 URL-committing input을, 콘텐츠가 있는 route는 콘텐츠 위 `ResearchRouteSearchBar`를 단일 commit 입력으로 쓰며, 결과 본문은 query 입력·별도 결과 타이틀을 반복하지 않고, refine controls는 결과 header controls 안에 남는다.
    executionRefs:
      - execution:run-001
      - execution:run-004
    scenarios:
      - scenario:research-route-search-shell
  - key: promise:research-route-cap-feedback#acceptance-check:research-route-cap-feedback-canonical-url
    assertion: vitest @ `app/(research)/__tests__/research-routes.test.tsx` + `app/components/research-route-renderers/__tests__/search-view-states.test.tsx` ("opens gap analysis in a detached window without replacing the current search route"; "continues the detached gap handoff after the source search view unmounts") — 검색·인용 계보·비슷한 논문은 조건 주소에서 실행되고, 연구 공백 리포트는 출발 탐색 화면을 유지한 채 별도 창의 `/gap/:id` artifact route로 열린다. 같은 창의 탐색 화면 전환은 browser history에 남아 뒤로가기가 이전 조건 화면을 복원한다. 조건 주소는 재실행으로 열리고 gap report artifact는 저장 id route로 복원된다.
    executionRefs:
      - execution:run-002
    scenarios:
      - scenario:research-route-canonical-url
  - key: promise:research-route-cap-feedback#acceptance-check:research-route-cap-feedback-condition-overflow
    assertion: guard @ `scripts/architecture-fitness/check-search-condition-url-budget.mjs` + vitest @ `app/lib/__tests__/search-condition-url-budget.test.ts`, `app/(research)/__tests__/research-routes.test.tsx`, `app/(research)/__tests__/relationship-route-page.test.tsx`, `app/components/research/__tests__/research-route-shell.test.tsx`, `app/components/research/__tests__/research-route-local-navigation.test.tsx`, `app/components/research/__tests__/search-followup-activation.test.tsx`, `app/server/services/__tests__/relationship-execution.test.ts`, `scripts/architecture-fitness/__tests__/search-condition-url-budget.test.ts` — production `URLSearchParams`와 UTF-8 request-target 측정으로 keyword·term·seed fallback·citation·similar 최대 envelope를 보존한다. Raw overflow, malformed year, duplicate scalar와 mode conflict는 normalization·truncate·omit 전에 거부한다. 내부 탐색과 local result-card/CitationLink는 throw 없이 현재 화면에 안내하고, 직접 연 주소는 공용 shell의 auth/library bootstrap·background task와 route provider·canonical identity 전에 조건 오류로 끝난다. Relationship parser는 citation/similar route kind를 독립적으로 보존한다.
    executionRefs:
      - execution:run-003
      - execution:run-004
    scenarios:
      - scenario:research-route-canonical-url
  - key: promise:shared-gap-report-member-access#acceptance-check:shared-gap-report-member-access-authenticated-sharing
    assertion: vitest @ `app/api/gap-reports/__tests__/route.test.ts` ("does not expose a shared report reservation to an unauthenticated request"; "creates from a visible result snapshot without loading a source ResearchRoutePayload"; "returns a reused ready report without scheduling server-side viewed analytics") + `app/api/gap-reports/status/__tests__/route.test.ts` ("does not expose shared report status to an unauthenticated request") + `app/(research)/__tests__/gap-view-route-stale-core.test.tsx` ("does not read a shared gap report for an unauthenticated viewer") + `app/server/domain-access/__tests__/gap-network-view-access.test.ts` ("requires authentication before reading a shared report"; "reuses a content-addressed artifact without scoping the lookup to the creator"; "allows another authenticated member to read the same report with their own preference") + `app/server/domain-access/__tests__/gap-report-source-identity.test.ts` + `app/server/repository/__tests__/gap-reports.test.ts` + `app/domain/__tests__/research-route-payload-schema.test.ts` + `app/stores/__tests__/research-route-store.test.ts`. 인증된 가입자는 생성자와 무관하게 같은 `/gap/:id` 공유 본문을 읽고, 미인증 요청은 생성·상태 확인·직접 URL 조회 각각에서 본문보다 먼저 닫힌다. 생성은 persisted share-safe snapshot의 versioned digest로 전역 재사용한다. 공유 artifact는 owner를 갖지 않고 현재 principal은 `viewerPrincipalId`로만 projection되며, 가입자별 반응은 서로 분리되고 retired owner alias는 wire schema와 client store patch에서 거부된다.
    executionRefs:
      - execution:run-002
    scenarios:
      - scenario:research-route-rest-collection
