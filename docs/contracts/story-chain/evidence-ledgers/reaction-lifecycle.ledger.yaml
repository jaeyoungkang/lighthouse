implementationContracts:
  - Search, citation-lineage, and graph-neighbor route reactions are route-view state, generated from the visible `viewSnapshot` and not persisted through a route payload row.
  - "Gap report reactions are the persisted artifact exception: successful comments write through `PUT /api/gap-reports/:id/reaction`, and degraded runtime notices are rejected from that persisted path."
  - Explicit follow-up buttons append visible cards to the same `AgentPanel`; the complete card stack is restored after refresh or document rehydration.
  - route AI comment generation commands emit on a single trigger source per `(trigger, targetRoutePayloadId)`.
  - Visible pending state is raised as soon as an eligible routed document has a planned route AI comment and no settled reaction, even when the provider call is intentionally held for library hydration. Queue timing and visible loading timing are separate lifecycle edges.
  - The route AI comment generation scheduler coalesces duplicate `(trigger, targetRoutePayloadId)` commands to the latest command inside an execution, while each command captures the execution id that may accept its completion. An exact duplicate of the active command is dropped; newer freshness or reaction generation remains eligible for the existing single-flight queue.
  - The active execution owns one scalar reaction/history projection. Hydration patches reconcile that projection without clearing optimistic reaction state, and an old execution cannot mutate or clean up a replacement execution that reuses the same route payload id and timestamp.
verdict: met
