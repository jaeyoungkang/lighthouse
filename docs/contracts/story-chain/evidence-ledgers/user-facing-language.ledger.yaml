implementationContracts:
  - Fixed copy routes through i18n keys and rendered DOM tests on the target surface.
  - "`app/i18n/messages.ts` and `app/i18n/messages/*` are the fixed-copy registry. Each registry key must fall into an owner group that names the related Promise(s) and `aspect:user-facing-language-governance`."
  - The fixed-copy registry also carries semantic tone policies. Direct visitor-facing auth/onboarding copy must not use plain 반말형 endings, document-style public/internal guide copy may use 문서형 다체 when that surface stays consistent, and `[system]` event copy must not drift into direct-user 존댓말.
  - Generated copy routes through structured route-view AI comment generation, `RouteAiComment-or-null` schema checks, deterministic fixtures, or live judge evidence on the target surface.
  - "`aspect:visible-explanation-sufficiency` owns source/input/limit information structure. `aspect:reaction-prefers-load-bearing-facts` owns generated reaction prose density. This ledger owns the routing rule between fixed and generated language tracks."
