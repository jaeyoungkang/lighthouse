implementationContracts:
  - Report 상태 판정 뒤에만 사용자별 admission lease를 얻고, 같은 report duplicate는 token·CAS·runner를 만들지 않으며 다른 active report는 stable 429/Retry-After로 거부한다.
  - Report CAS가 work를 시작하지 못하면 matching admission token을 즉시 반환하고, 시작한 runner가 정착하면 반환한다. Release 실패 뒤 admission에 결속된 version보다 나중에 terminal이 된 report는 다음 claim이 한 번만 회수하고 process loss는 70초 lease expiry로 복구한다.
  - Report attempt/lease는 결과 commit authority로 유지되고 principal admission은 queue나 전역 LLM admission으로 승격하지 않는다.
  - Reads/status는 admission을 얻지 않으며 서로 다른 principal은 독립 slot을 갖는다. Enrichment retry의 report 단위 60초 cooldown은 별도로 유지된다.
verdict: met
