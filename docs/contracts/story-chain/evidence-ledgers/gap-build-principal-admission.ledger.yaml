  - key: promise:gap-network-detection-from-search#acceptance-check:gap-network-detection-from-search-principal-build-limit
    assertion: vitest @ `app/api/gap-reports/__tests__/route.admission.test.ts` + `app/server/domain-access/__tests__/gap-network-view-access.admission.test.ts` + `app/components/research-route-renderers/__tests__/search-view-agent-actions.admission.test.ts`; registered DB integration @ `app/server/repository/__tests__/gap-build-principal-admissions.postgres.integration.ts`. Report 상태를 판정한 뒤 principal admission을 얻은 command만 새 core 또는 failed-core recovery를 runner에 넘긴다. 같은 principal의 다른 active report는 stable 429/Retry-After로 거부되고 detached target은 active report로 이동해 안내를 보여 준다. 같은 report duplicate는 새 token·CAS·runner를 만들지 않는다. CAS no-start와 runner 정착은 matching token을 반환한다. Release 실패 뒤 admission이 결속한 report version보다 나중에 terminal이 된 report와 expiry만 다음 claim이 회수하며, 재발급 직후 같은 terminal version이나 다른 report가 token을 탈취하지 못한다. SECURITY DEFINER RPC는 fixed search path와 service-role-only 실행을 유지하고 direct table DML은 허용하지 않는다. Reads/status는 admission을 얻지 않고 서로 다른 principal은 독립 slot을 가진다.
    executionRefs:
      - execution:run-001
      - execution:run-002
    scenarios:
      - scenario:search-gap-analysis-entry
  - key: promise:gap-report-prepared-reaction#acceptance-check:gap-report-prepared-reaction-principal-build-limit
    assertion: vitest @ `app/server/domain-access/__tests__/gap-network-enrichment-retry.test.ts` + `app/api/gap-reports/[id]/enrichment-retry/__tests__/route.test.ts` + `app/components/research-route-renderers/__tests__/GapNetworkView.retry-response.test.tsx`; registered DB integration @ `scripts/db-integration/run-gap-report-concurrency.ts`. Enrichment retry는 ready core graph와 failed enrichment 상태를 읽은 뒤 principal admission을 얻고서만 report version CAS를 수행한다. 다른 report가 active이면 core graph를 보존한 채 stable 429/Retry-After와 현재 계산 안내를 보여 주며, same-report/concurrent CAS loser는 work를 늘리지 않고 matching token을 반환한다. Report 단위 60초 cooldown은 principal admission과 별도로 유지된다.
    executionRefs:
