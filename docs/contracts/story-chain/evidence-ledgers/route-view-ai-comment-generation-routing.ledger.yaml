implementationContracts:
  - Automatic route AI comments use `POST /api/route-ai-comments/generate/:viewId`. They do not send compatibility `[system]` text through the legacy interactive reaction stream and do not share that response execution path.
  - "Eligible generation targets are only ResearchRoutePayloads with a visible reaction slot: completed search ResearchRoutePayloads with results, `citation_lineage`, and `graph_neighbors`. `pdf`, `gap_network`, and empty search ResearchRoutePayloads are unsupported for this endpoint."
  - Client commands always carry `trigger`, `targetRoutePayloadId`, `executionId`, `reactionGeneration`, `createdAt`, and the canonical `ViewSnapshot`. The projection key is derived deterministically from that snapshot; commands do not carry an independently writable key. The scheduler coalesces duplicate opened commands per `(trigger, targetRoutePayloadId)` while preserving independent targets. Flush and completion require that the captured execution is still active, so a same-id replacement runtime does not consume the previous runtime's command. A changed projection clears the ephemeral comment, advances generation, and queues the current projection behind active single-flight work. Active completion and final store commit compare the captured projection with the current projection. UI-only metadata changes outside that projection do not re-fire an active command. Pending rerenders or active-request settlement do not shorten the 240ms coalescing window.
  - Route bootstrap is scoped to the single route-owned ResearchRoutePayload. Route changes abort the active generation, clear the pending queue, and clear regeneration state for the departed route execution.
  - "Route bootstrap separates visible pending ownership from provider-call timing: eligible result ResearchRoutePayloads mark pending loading at commit. Unfaceted search starts from the committed terrain immediately; hydration-owned search facets and lightweight graph-neighbor authors wait for one ready projection before the provider call."
  - The generation endpoint consumes the caller-supplied visible `viewSnapshot`; search, citation-lineage, and graph-neighbor generation does not reload a stored route payload row and does not persist the returned reaction. Gap report successful comments remain the artifact exception and persist through `PUT /api/gap-reports/:id/reaction`.
  - The generation endpoint exposes `Server-Timing` phases for `parse`, `route-auth`, `generate`, and `total`, so slow AI comments can be separated into route overhead and provider generation time.
  - "Automatic route AI comment generation is a single structured generation call, not an agent/tool loop. Provider retry is disabled, `maxOutputTokens` bounds the generated JSON, and invalid, aborted, timed-out, or empty generation returns `reaction: null` rather than a fallback comment."
  - The automatic route-owned AI comment structured call uses the lite Gemini model, a 10s server structured generation deadline, a 768 max-output-token JSON cap, and a 15s client transport timeout. This fast lane is separate from the legacy interactive stream and keeps title/body/chips payload validation as the visible output contract.
  - The AI provider gateway only exposes structured generation for this path and applies JSON mode, request timeout, retry budget, and abort-signal cleanup in one place.
  - "Shared in-flight generation work is not tied to the first caller's abort signal within one application process. Caller aborts are composed through a shared controller, and the provider call is aborted only after all active duplicate callers disconnect. Different application instances may execute the same provider work independently. If a provider ignores that abort and returns a late successful reaction, the route returns `reaction: null` without persisting the stale success."
verdict: met
