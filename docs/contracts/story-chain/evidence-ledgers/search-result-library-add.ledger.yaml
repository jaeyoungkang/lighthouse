implementationContracts:
  - Search result cards expose one title-row library state toggle only as state management on the paper card, visually separated from PDF/citation/similar navigation actions. The compact square control uses an outline bookmark with an accent border when unsaved and a filled bookmark with success treatment when saved. It does not repeat a visible command label; its accessibility label/title carries `라이브러리에 추가` or the current remove action `라이브러리에서 해제`. Cards without a library toggle handler do not render a separate read-only saved-state badge. The control calls the existing reviewed-paper route/domain-access/repository path and then renders from a current reviewed id set composed from search metadata, the internal library list store, and successful local/list mutation overrides. Successful card mutations also update the internal library list store so a visible route-level list reflects the same source. Stale search ResearchRoutePayload metadata must not clear a just-saved card or resurrect a just-removed card while the current reviewed_papers state says otherwise.
  - The save action writes the internal `reviewed_papers` state that library-grounded search automatically reads as its library-proximity source. The remove action deletes the same row. Search and bootstrap read the owner-scoped source for each new execution, so a previous empty result is not reused after either committed mutation.
  - Search entry and follow-up paths use the current `reviewed_papers` source without a selectable personalization preference.
  - Internal reviewed_papers list UI may read the same saved state for display or management. A list refresh applies only if no newer local save/remove mutation has changed the list-store revision, and a fresh refresh emits reviewed-state diffs so visible cards keep the same saved/unsaved state as the list.
  - "`paper_saved` and `paper_unsaved` emit only after the reviewed-papers mutation succeeds. They carry `journey_context_id`, `search_context_id`, `paper_id`, rank, surface, PDF availability, and evidence availability. Raw query, query hash, paper title, token, and AI output are forbidden. The global library list does not emit a search-journey event because it has no originating rank or search context."
verdict: met
