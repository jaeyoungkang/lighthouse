implementationContracts:
  - Visible AI-generated content carries a low-friction feedback affordance near the content it evaluates.
  - Dense repeated AI summary surfaces may defer feedback until the user expands or focuses the AI output details.
  - Submitted feedback displays an immediate visible saved state, leaves the selected value visually stronger than the unselected value, and restores that selection for the same browser-session output surface after remount.
  - Selected feedback uses small-area visual emphasis such as icon fill and border/text color, not a filled button background that competes with AI content.
  - Feedback records preserve provenance for the source ResearchRoutePayload or artifact, visible surface, Promise family, and AI output fingerprint. Raw AI output text is not stored in the telemetry payload.
  - Feedback collection does not obscure the AI content body or required follow-up actions.
  - Feedback persistence failure does not break the user's reading flow.
  - This Aspect does not promise immediate model training, response regeneration, ranking changes, or quality guarantees.
verdict: met
