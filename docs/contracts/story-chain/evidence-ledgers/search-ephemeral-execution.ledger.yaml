implementationContracts:
  - The listed Promise(s) are verified by the Acceptance Check entries and structured executions on this ledger.
  - "`guard:search-first-paint-no-db` — 검색 첫 결과 경로가 route-owned provider boundary 안에서 실행되는지 static/dynamic import graph로 검증한다. Fire-and-forget server analytics mirror의 `analytics-events` repository chain과 `search-execution.ts`에서 명시 marker로 keyword fetch와 동시에 시작하는 owner-shaped live My Library source chain만 bounded repository side-channel로 허용한다 (`quality:guards` wiring, operational-readiness anti-pattern lint family)."
  - "`guard:state-boundaries` — 한 production analysis에서 search와 relationship route policy를 함께 평가한다. URL condition에서 server execution input으로 이어지는 단일 authority 경로, standard Array·Set dependency와 deterministic facet normalization, literal-prefix `node:crypto` SHA-256 canonical ephemeral view identity, active route execution의 `currentView` hydration/cleanup owner를 TypeScript·JavaScript symbol과 AST에서 인벤토리화한다. Production source가 inventory에서 제외되는 `__tests__`·`.test` module을 획득하거나 비정적 module acquisition·CommonJS loader alias를 사용하는 경로는 세 inventory fact를 모두 fail-closed로 닫는다. Alias를 거친 병렬 owner, store capability escape, dynamic/symbol-aliased reflection·`Object.assign` direct write도 거부한다."
  - "`guard:search-condition-url-budget` — `/search`, `/citation`, `/similar`의 production builder와 parser가 같은 `URLSearchParams`·UTF-8 byte owner를 거치고, 초과 조건을 provider 실행과 canonical identity 생성 전에 truncate/omit 없이 거부하는지 확인한다. 사용자-visible 공통 거부 약속과 정확한 evidence는 `research-route-cap-feedback.ledger.yaml`이 소유한다."
verdict: met
