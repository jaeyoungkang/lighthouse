implementationContracts:
  - same-window keyword follow-up receipt는 `ResearchRouteShell` 아래 Context가 소유한다. 전역 Zustand store, URL state, destination processing state가 아니다.
  - "`논문검색`과 `[검색어] 으로 논문 검색` 버튼의 회전 표시, `aria-busy`, 비활성 상태는 같은 Context의 현재 activation에서 파생한다."
  - persistent `role="status"` region은 현재 scroll viewport 상단에 sticky로 남고 `aria-busy`를 사용하지 않는다. origin content는 그대로 mount된다.
  - destination route arrival, synchronous navigation invocation failure, 30초 bounded timeout, shell unmount가 cleanup boundary다. identity comparison은 이전 cleanup이 새 클릭을 지우지 못하게 한다.
  - Ctrl/Cmd/가운데 클릭은 동일 entry URL을 detached tab에서 열며 현재 창 Context를 시작하지 않는다. exact same-route no-op도 receipt를 시작하지 않는다.
verdict: met
