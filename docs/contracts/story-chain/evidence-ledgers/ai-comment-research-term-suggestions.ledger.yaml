  - key: promise:graph-neighbor-papers#acceptance-check:graph-neighbor-papers-gap-surface
    assertion: vitest @ `app/components/research/__tests__/inline-ai-comment-treatment.test.tsx` ("uses one frame treatment for search, citation lineage, and graph-neighbor AI comments") + `app/components/research-route-renderers/__tests__/GraphNeighborsView.inline-analysis-terms.test.tsx` ("renders graph-neighbor research terms inside the AI comment frame") + `app/components/research-route-renderers/__tests__/relationship-view-ai-comment-actions.test.tsx` ("shows the owned research-gap map action above the graph-neighbor AI comment frame") + `app/server/services/__tests__/episteme-literature.test.ts` ("derives both graph axes from E3 discovery evidence") + `app/api/gap-reports/__tests__/route.test.ts` ("creates from a visible result snapshot without loading a source ResearchRoutePayload") + gap-network source coverage in `gap-network-e2.ledger.yaml` ("acceptance-check:gap-network-detection-from-search-graph-neighbor-source"). Asserts graph-neighbor AI comment hosts append grounded inline-analysis research terms as compact clickable text in the same AI comment frame while preserving the host-owned research-gap action above and outside that frame when graph candidates exist; term clicks use `termSeed` follow-up search behavior. The graph-neighbor source evidence stores co-cited/coupled adjacency counts in graph_neighbors metadata, and the gap-network source ledger verifies the visible graph-neighbor snapshot is accepted by the gap route/server path so all graph candidates plus co-cited/coupled shared-count support reach the existing gap-network builder without source route payload reload.
    executionRefs:
