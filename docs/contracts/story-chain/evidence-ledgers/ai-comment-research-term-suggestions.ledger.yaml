  - key: promise:search-results-fast-window#acceptance-check:search-results-fast-window-year-distribution
    assertion: vitest @ `app/components/research/__tests__/SearchResultsOverviewPanel.test.tsx` ("keeps search metadata compact and renders research terms as clickable AI comment text") + `app/components/research-route-renderers/__tests__/search-view-content.year-range.test.tsx` ("keeps publication-year distribution inside the year filter dropdown"). Publication-year distribution renders as a distinct block inside the publication-year filter dropdown panel (`search-year-filter-panel`) when that dropdown is open. `app/components/research/__tests__/SearchResultsOverviewPanel.test.tsx` ("draws the year distribution as a continuous full-width axis") asserts the chart renders one equal-width bar per year from the earliest to the latest result year (a bar for every year in the span, including gap years marked `data-empty="true"`) so present years are never dropped and the axis always fills the width, and that each year bar exposes a `{year}년 {count}편` app-rendered hover tooltip (`search-year-tooltip-<year>`). `app/components/research-route-renderers/__tests__/search-view-content.year-range.test.tsx` ("accents only the bars inside the entered publication-year range") asserts the accent highlight tracks the entered 시작~끝 range (bars in range carry `data-highlight="true"`, others `false`) and that an empty range highlights nothing.
    executionRefs:
