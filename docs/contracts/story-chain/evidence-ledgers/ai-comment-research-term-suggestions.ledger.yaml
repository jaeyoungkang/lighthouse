implementationContracts:
  - Research terms use compact text-like buttons inside a sentence in the AI comment frame. The `주요 연구 용어` prefix and following keywords stay on one no-wrap line inside the term section; if the line is wider than the frame, the section may scroll horizontally. Generated prose stays readable, while research-term suggestions read as part of the same AI comment flow. The search gap action is owned by the result-basis row; citation-lineage and graph-neighbor gap actions remain host-owned actions above and outside the AI comment frame.
  - "The search metadata preview is separate from term exploration: publication-year distribution belongs inside the publication-year filter dropdown panel, while research terms sit in the AI comment frame."
  - Relationship documents build grounded term candidates only from the current ResearchRoutePayload's current-version, fingerprinted inline-analysis semantic profiles backed by a usable abstract. Legacy or whitespace-only embedded analysis produces no term line; the surface does not invent generic terms just because the Aspect applies.
verdict: met
