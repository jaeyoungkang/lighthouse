name: Search Quality Synthetic Evidence

on:
  workflow_dispatch: {}
concurrency:
  group: search-quality-synthetic-evidence
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      EPISTEME_LITERATURE_API_URL: http://127.0.0.1:43123
      MOONLIGHT_SCHOLAR_AUTH_JWT_SECRET: synthetic-search-quality-session-secret-v1
      MOONLIGHT_SCHOLAR_AUTH_TOKEN_ISSUER: moonlight
      MOONLIGHT_SCHOLAR_AUTH_TOKEN_AUDIENCE: moonlight-scholar
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve exact protected-main execution
        env:
          TARGET_REVISION: ${{ github.sha }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [[ ! "$TARGET_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid protected-main target revision" >&2
            exit 1
          fi
          if [[ "$WORKFLOW_REVISION" != "$TARGET_REVISION" ]]; then
            echo "workflow revision must equal the exact protected-main target" >&2
            exit 1
          fi
          command -v setsid >/dev/null
          test -z "$(git status --porcelain)"
      - name: Start local Supabase and apply repository migrations
        run: |
          npm run db:start:ci
          npm run db:reset:local
      - name: Export loopback Supabase runtime values
        env:
          STATUS_JSON: ${{ runner.temp }}/supabase-status.json
        run: |
          npx --no-install supabase status -o json > "$STATUS_JSON"
          node - "$STATUS_JSON" "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync(process.argv[2], "utf8");
          const status = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
          for (const key of ["API_URL", "ANON_KEY", "SERVICE_ROLE_KEY"]) {
            if (typeof status[key] !== "string" || status[key].length === 0) process.exit(1);
          }
          fs.appendFileSync(
            process.argv[3],
            `NEXT_PUBLIC_SUPABASE_URL=${status.API_URL}\n` +
              `NEXT_PUBLIC_SUPABASE_ANON_KEY=${status.ANON_KEY}\n` +
              `SUPABASE_SERVICE_ROLE_KEY=${status.SERVICE_ROLE_KEY}\n`,
          );
          NODE
      - name: Start the exact-target Lighthouse runtime
        run: |
          nohup setsid node node_modules/next/dist/bin/next dev -H 127.0.0.1 > "$RUNNER_TEMP/search-quality-next.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/search-quality-next.pid"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Lighthouse runtime did not become ready" >&2
          exit 1
      - name: Collect synthetic actual-path reports
        id: collect
        env:
          SET_PATH: scripts/search-quality/fixtures/deterministic-wiring.v1.json
          MANIFEST_PATH: ${{ runner.temp }}/search-quality-manifest.json
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          query_count="$(jq '.queries | length' "$SET_PATH")"
          for ((index=0; index<query_count; index++)); do
            if [[ -f "$RUNNER_TEMP/search-quality-fixture.pid" ]]; then
              kill -- -"$(cat "$RUNNER_TEMP/search-quality-fixture.pid")" || true
              wait "$(cat "$RUNNER_TEMP/search-quality-fixture.pid")" 2>/dev/null || true
            fi
            nohup setsid node --import tsx scripts/load-smoke/run-provider-fixture.ts \
              --profile healthy --delay-ms 0 --paper-count 3 \
              > "$RUNNER_TEMP/search-quality-fixture.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/search-quality-fixture.pid"
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:43123/__stats >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:43123/__stats >/dev/null || exit 1
            query="$(jq -r --argjson index "$index" '.queries[$index].query' "$SET_PATH")"
            npx --no-install tsx scripts/load-smoke/run.ts \
              --mode one-shot --users 1 --query "$query" \
              --base-url http://127.0.0.1:3000 \
              --input-profile search-quality-deterministic-wiring-v1 \
              --provider-profile local-fixture-healthy-v1 \
              --provider-stats-url http://127.0.0.1:43123/__stats \
              --topology-profile local-single-next-process \
              --run-owner search-quality-evidence-workflow \
              --run-label "search-quality-$index"
          done
          jq '{reports: [.queries | to_entries[] | {queryId: .value.id, path: ("reports/load-smoke/search-quality-" + (.key | tostring) + ".json")}]}' \
            "$SET_PATH" > "$MANIFEST_PATH"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          echo "started-at=$started_at" >> "$GITHUB_OUTPUT"
          echo "completed-at=$completed_at" >> "$GITHUB_OUTPUT"
      - name: Stop code-executing collection processes before evidence build
        run: |
          for file in "$RUNNER_TEMP/search-quality-next.pid" "$RUNNER_TEMP/search-quality-fixture.pid"; do
            [[ -f "$file" && ! -L "$file" ]] || { echo "collection process identity is missing or invalid" >&2; exit 1; }
            pgid="$(cat "$file")"
            [[ "$pgid" =~ ^[1-9][0-9]*$ ]] || { echo "collection process identity is malformed" >&2; exit 1; }
            kill -- -"$pgid" || true
            for attempt in {1..10}; do
              if ! kill -0 -- -"$pgid" 2>/dev/null; then continue 2; fi
              sleep 1
            done
            echo "collection process did not stop before evidence build" >&2
            exit 1
          done
          npm run db:stop:ci
          test -z "$(git status --porcelain)"
      - name: Build and self-check candidate evidence from raw reports
        env:
          SEARCH_QUALITY_COLLECTION_STARTED_AT: ${{ steps.collect.outputs.started-at }}
          SEARCH_QUALITY_COLLECTION_COMPLETED_AT: ${{ steps.collect.outputs.completed-at }}
          MANIFEST_PATH: ${{ runner.temp }}/search-quality-manifest.json
          PUBLISH_PATH: ${{ runner.temp }}/search-quality-published
        run: |
          mkdir -m 700 "$PUBLISH_PATH"
          npm run search-quality:build-candidate -- \
            --set scripts/search-quality/fixtures/deterministic-wiring.v1.json \
            --manifest "$MANIFEST_PATH" --output "$PUBLISH_PATH/bundle.json"
          npm run search-quality:self-check -- \
            --set scripts/search-quality/fixtures/deterministic-wiring.v1.json \
            --manifest "$MANIFEST_PATH" --bundle "$PUBLISH_PATH/bundle.json" \
            --output "$PUBLISH_PATH/verification.json"
          test "$(find "$PUBLISH_PATH" -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd ' ' -)" = "bundle.json verification.json"
      - name: Publish aggregate-only synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-quality-synthetic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/search-quality-published/bundle.json
            ${{ runner.temp }}/search-quality-published/verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop local services
        if: always()
        run: |
          for file in "$RUNNER_TEMP/search-quality-next.pid" "$RUNNER_TEMP/search-quality-fixture.pid"; do
            if [[ -f "$file" && ! -L "$file" ]]; then
              pgid="$(cat "$file")"
              if [[ "$pgid" =~ ^[1-9][0-9]*$ ]]; then kill -- -"$pgid" || true; fi
            fi
          done
          npm run db:stop:ci || true
